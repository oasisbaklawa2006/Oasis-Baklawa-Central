name: Android TV app — build & lint

on:
  pull_request:
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv-ci.yml"
  push:
    branches: [main]
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Provisions Gradle 8.7 directly -- does not require the wrapper JAR
      # to be committed (it isn't; see android-tv/README.md).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Lint (release)
        run: gradle :app:lintRelease --no-daemon

      - name: Unit tests (debug)
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble unsigned release
        run: gradle :app:assembleRelease --no-daemon
        env:
          CENTRAL_WEB_ORIGIN: https://app.oasisbaklawacentral.com

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: oasis-central-tv-unsigned-release
          path: android-tv/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
