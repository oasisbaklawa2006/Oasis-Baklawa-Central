name: Temporary RGS read-contract patch

on:
  push:
    branches:
      - fix/rgs-read-contract-diagnostics
    paths:
      - .github/workflows/tmp-rgs-read-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rgs-read-contract-diagnostics
      - name: Patch ReadyGoodsStore read contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/admin/ReadyGoodsStore.tsx')
          text = path.read_text()

          old_order = '.order("orders(created_at)", { ascending: true })'
          new_order = '.order("created_at", { ascending: true, referencedTable: "order" })'
          if old_order not in text:
              raise SystemExit('expected embedded-order expression not found')
          text = text.replace(old_order, new_order, 1)

          old_failed = '''      const failed = availabilityResult.error ?? demandResult.error ?? jobsResult.error ?? transfersResult.error
        ?? reservationsResult.error ?? issueEventsResult.error;
      if (failed) throw failed;'''
          new_failed = '''      const failed = [
        ["availability", availabilityResult.error],
        ["demand", demandResult.error],
        ["production_jobs", jobsResult.error],
        ["production_rgs_transfers", transfersResult.error],
        ["inventory_reservations", reservationsResult.error],
        ["rgs_issue_events", issueEventsResult.error],
      ].find((entry) => entry[1]);
      if (failed) {
        const [contract, cause] = failed;
        const detail = cause && typeof cause === "object" && "message" in cause
          ? String((cause as { message?: unknown }).message ?? "Unknown data error")
          : String(cause ?? "Unknown data error");
        throw new Error(`${contract}: ${detail}`);
      }'''
          if old_failed not in text:
              raise SystemExit('expected combined failure block not found')
          text = text.replace(old_failed, new_failed, 1)

          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/tmp-rgs-read-contract-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/ReadyGoodsStore.tsx .github/workflows/tmp-rgs-read-contract-patch.yml
          git commit -m "fix(rgs): correct embedded order and surface read contract failures"
          git push origin HEAD:fix/rgs-read-contract-diagnostics
