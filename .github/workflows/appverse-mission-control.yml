name: Appverse Mission Control

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appverse-mission-control
  cancel-in-progress: false

jobs:
  refresh-live-evidence:
    if: github.repository == 'oasisbaklawa2006/Oasis-Baklawa-Central'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dedicated live-state branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: mission-control/live-state
          persist-credentials: false

      - name: Refresh objective GitHub evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/appverse-control/update_github_state.sh

      - name: Commit live evidence only when changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- appverse-control/generated/github-state.json; then
            echo 'Mission Control evidence already current.'
            exit 0
          fi
          git config user.name 'oasis-mission-control[bot]'
          git config user.email 'oasis-mission-control[bot]@users.noreply.github.com'
          git add appverse-control/generated/github-state.json
          git commit -m 'chore(mission-control): refresh live Appverse evidence'
          gh auth setup-git
          git push origin HEAD:mission-control/live-state
