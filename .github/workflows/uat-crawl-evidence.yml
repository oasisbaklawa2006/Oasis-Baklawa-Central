name: UAT Crawl Evidence (authenticated)

# Read-only Appverse UAT evidence collection for PR #462 / Workstation 5.
# Reuses governed TEST_* secret names from lane1-live-smoke and dispatch RLS cert.
# Never logs credential values. Pre-auth tranche screenshots are preserved separately.
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Optional override — defaults to TEST_PREVIEW_URL secret (must be *.vercel.app or localhost)"
        required: false
        type: string
      run_tranche:
        description: "Crawl tranche: post-fix-483 (UAT-0018/0020), auth-rerun (0002–0020 minus buyer sheet), tranche-03 (0021–0030), or combined"
        required: true
        default: post-fix-483
        type: choice
        options:
          - post-fix-483
          - auth-rerun
          - tranche-03
          - both
          - all
  push:
    branches:
      - cursor/physical-uat-readiness-matrix-e763

permissions:
  contents: read

concurrency:
  group: uat-crawl-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uat-crawl:
    name: Authenticated UAT evidence crawl
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_TRANCHE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_tranche || 'all' }}
      TEST_PREVIEW_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_url != '' && github.event.inputs.target_url || secrets.TEST_PREVIEW_URL }}
      UAT_CRAWL_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_url != '' && github.event.inputs.target_url || secrets.TEST_PREVIEW_URL }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_BUYER_EMAIL: ${{ secrets.TEST_BUYER_EMAIL }}
      TEST_BUYER_PASSWORD: ${{ secrets.TEST_BUYER_PASSWORD }}
      TEST_SALES_EMAIL: ${{ secrets.TEST_SALES_EMAIL }}
      TEST_SALES_PASSWORD: ${{ secrets.TEST_SALES_PASSWORD }}
      TEST_FINANCE_EMAIL: ${{ secrets.TEST_FINANCE_EMAIL }}
      TEST_FINANCE_PASSWORD: ${{ secrets.TEST_FINANCE_PASSWORD }}
      TEST_ASSEMBLY_EMAIL: ${{ secrets.TEST_ASSEMBLY_EMAIL }}
      TEST_ASSEMBLY_PASSWORD: ${{ secrets.TEST_ASSEMBLY_PASSWORD }}
      TEST_DISPATCH_EMAIL: ${{ secrets.TEST_DISPATCH_EMAIL }}
      TEST_DISPATCH_PASSWORD: ${{ secrets.TEST_DISPATCH_PASSWORD }}
      TEST_OPERATIONS_EMAIL: ${{ secrets.TEST_OPERATIONS_EMAIL }}
      TEST_OPERATIONS_PASSWORD: ${{ secrets.TEST_OPERATIONS_PASSWORD }}
      UAT_CRAWL_PRODUCTION: "true"
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Record crawl plan (run id + tranche)
        shell: bash
        run: |
          set -euo pipefail
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "run_tranche=${RUN_TRANCHE}" >> "$GITHUB_ENV"
          echo "UAT crawl run ${GITHUB_RUN_ID} tranche=${RUN_TRANCHE} ref=${GITHUB_REF}"

      - name: Report configured secret presence (names only)
        shell: bash
        run: |
          set -euo pipefail
          for name in TEST_PREVIEW_URL TEST_ADMIN_EMAIL TEST_ADMIN_PASSWORD TEST_BUYER_EMAIL TEST_BUYER_PASSWORD \
                      TEST_SALES_EMAIL TEST_SALES_PASSWORD TEST_FINANCE_EMAIL TEST_FINANCE_PASSWORD \
                      TEST_ASSEMBLY_EMAIL TEST_ASSEMBLY_PASSWORD TEST_DISPATCH_EMAIL TEST_DISPATCH_PASSWORD \
                      TEST_OPERATIONS_EMAIL TEST_OPERATIONS_PASSWORD TEST_GATE_SECURITY_EMAIL TEST_GATE_SECURITY_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then
              echo "present: $name"
            else
              echo "missing: $name"
            fi
          done

      - name: Resolve and validate target URL (no secrets logged)
        shell: bash
        env:
          RAW_URL: ${{ env.TEST_PREVIEW_URL }}
        run: |
          set -euo pipefail
          url="${RAW_URL:-}"
          if [[ -z "$url" ]]; then
            echo "::notice::TEST_PREVIEW_URL secret missing — using approved production fallback for post-#483 UAT crawl."
            url="https://b2b.oasisbaklawa.com"
          fi
          if [[ "$url" == *$'\n'* || "$url" == *$'\r'* ]]; then
            echo "::error::Target URL contains newline — refusing."
            exit 1
          fi
          host="$(python3 -c "import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname or '')" "$url")"
          echo "Target host: $host"
          if [[ "$host" == "b2b.oasisbaklawa.com" || "$host" == "localhost" || "$host" == "127.0.0.1" || "$host" == *".vercel.app" ]]; then
            echo "Target host approved for UAT crawl."
          else
            echo "::error::Target host $host not in approved UAT crawl allowlist (production, localhost, *.vercel.app)."
            exit 1
          fi
          echo "TEST_PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "UAT_CRAWL_BASE_URL=$url" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run post-fix #483 buyer approval re-test (UAT-0018 + UAT-0020)
        if: env.RUN_TRANCHE == 'post-fix-483' || env.RUN_TRANCHE == 'all'
        continue-on-error: true
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/post-fix-483-rerun.spec.ts

      - name: Run authenticated UAT auth-rerun
        if: env.RUN_TRANCHE == 'auth-rerun' || env.RUN_TRANCHE == 'both' || env.RUN_TRANCHE == 'all'
        continue-on-error: true
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/auth-rerun.spec.ts

      - name: Run UAT tranche 03 (chronological continue)
        if: env.RUN_TRANCHE == 'tranche-03' || env.RUN_TRANCHE == 'both' || env.RUN_TRANCHE == 'all'
        continue-on-error: true
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/tranche-03-crawl.spec.ts

      - name: Write run metadata for commit job
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/uat-crawl
          cat > docs/uat-crawl/UAT_GHA_RUN.json <<EOF
          {
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "runTranche": "${RUN_TRANCHE}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "completedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload UAT evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-crawl-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            uat-evidence/screenshots/
            docs/uat-crawl/UAT_MANIFEST*.jsonl
            docs/uat-crawl/UAT_INDEX*.md
            docs/uat-crawl/UAT_AUTH_RERUN_SUMMARY.json
            docs/uat-crawl/UAT_POST_FIX_483_SUMMARY.json
            docs/uat-crawl/UAT_GHA_RUN.json
            docs/uat-crawl/UAT_FAILURE_LEDGER.md
          if-no-files-found: warn
          retention-days: 30

  commit-evidence:
    name: Commit UAT evidence to branch
    needs: uat-crawl
    if: always() && needs.uat-crawl.result != 'cancelled' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: uat-crawl-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Commit manifests and screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uat-evidence/screenshots/ docs/uat-crawl/UAT_MANIFEST*.jsonl docs/uat-crawl/UAT_INDEX*.md \
                  docs/uat-crawl/UAT_AUTH_RERUN_SUMMARY.json docs/uat-crawl/UAT_POST_FIX_483_SUMMARY.json \
                  docs/uat-crawl/UAT_GHA_RUN.json docs/uat-crawl/UAT_FAILURE_LEDGER.md docs/uat-crawl/UAT_CRAWL_PROGRESS.md || true
          if git diff --staged --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "UAT evidence from GHA run ${{ github.run_id }} (tranche ${{ needs.uat-crawl.outputs.run_tranche || 'all' }})"
          git push
