name: UAT Crawl Evidence (authenticated)

# Read-only Appverse UAT evidence collection for PR #462 / Workstation 5.
# Reuses governed TEST_* secret names from lane1-live-smoke and dispatch RLS cert.
# Never logs credential values. Pre-auth tranche screenshots are preserved separately.
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Optional override — defaults to TEST_PREVIEW_URL secret (must be *.vercel.app or localhost)"
        required: false
        type: string
      run_tranche:
        description: "Crawl tranche: post-fix-483 (UAT-0018/0020), auth-rerun (0002–0020 minus buyer sheet), tranche-03 (0021–0030), or combined"
        required: true
        default: post-fix-483
        type: choice
        options:
          - post-fix-483
          - auth-rerun
          - tranche-03
          - both
          - buyer-mobile
          - ai-uat
          - post-merge-proofs
          - all
  push:
    branches:
      - cursor/physical-uat-readiness-matrix-e763

permissions:
  contents: read
  deployments: read

concurrency:
  group: uat-crawl-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uat-crawl:
    name: Authenticated UAT evidence crawl
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN_TRANCHE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_tranche || 'all' }}
      TEST_PREVIEW_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_url != '' && github.event.inputs.target_url || secrets.TEST_PREVIEW_URL }}
      UAT_CRAWL_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_url != '' && github.event.inputs.target_url || secrets.TEST_PREVIEW_URL }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_BUYER_EMAIL: ${{ secrets.TEST_BUYER_EMAIL }}
      TEST_BUYER_PASSWORD: ${{ secrets.TEST_BUYER_PASSWORD }}
      TEST_SALES_EMAIL: ${{ secrets.TEST_SALES_EMAIL }}
      TEST_SALES_PASSWORD: ${{ secrets.TEST_SALES_PASSWORD }}
      TEST_FINANCE_EMAIL: ${{ secrets.TEST_FINANCE_EMAIL }}
      TEST_FINANCE_PASSWORD: ${{ secrets.TEST_FINANCE_PASSWORD }}
      TEST_ASSEMBLY_EMAIL: ${{ secrets.TEST_ASSEMBLY_EMAIL }}
      TEST_ASSEMBLY_PASSWORD: ${{ secrets.TEST_ASSEMBLY_PASSWORD }}
      TEST_DISPATCH_EMAIL: ${{ secrets.TEST_DISPATCH_EMAIL }}
      TEST_DISPATCH_PASSWORD: ${{ secrets.TEST_DISPATCH_PASSWORD }}
      TEST_OPERATIONS_EMAIL: ${{ secrets.TEST_OPERATIONS_EMAIL }}
      TEST_OPERATIONS_PASSWORD: ${{ secrets.TEST_OPERATIONS_PASSWORD }}
      TEST_RGS_EMAIL: ${{ secrets.TEST_RGS_EMAIL }}
      TEST_RGS_PASSWORD: ${{ secrets.TEST_RGS_PASSWORD }}
      TEST_PRODUCTION_EMAIL: ${{ secrets.TEST_PRODUCTION_EMAIL }}
      TEST_PRODUCTION_PASSWORD: ${{ secrets.TEST_PRODUCTION_PASSWORD }}
      TEST_TV_RGS_EMAIL: ${{ secrets.TEST_TV_RGS_EMAIL }}
      TEST_TV_RGS_PASSWORD: ${{ secrets.TEST_TV_RGS_PASSWORD }}
      TEST_TV_PRODUCTION_EMAIL: ${{ secrets.TEST_TV_PRODUCTION_EMAIL }}
      TEST_TV_PRODUCTION_PASSWORD: ${{ secrets.TEST_TV_PRODUCTION_PASSWORD }}
      TEST_AI_STUDIO_PREVIEW_URL: ${{ secrets.TEST_AI_STUDIO_PREVIEW_URL }}
      TEST_TRACE_PREVIEW_URL: ${{ secrets.TEST_TRACE_PREVIEW_URL }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Record crawl plan (run id + tranche)
        shell: bash
        run: |
          set -euo pipefail
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "run_tranche=${RUN_TRANCHE}" >> "$GITHUB_ENV"
          echo "UAT crawl run ${GITHUB_RUN_ID} tranche=${RUN_TRANCHE} ref=${GITHUB_REF}"

      - name: Report configured secret presence (names only)
        shell: bash
        run: |
          set -euo pipefail
          for name in TEST_PREVIEW_URL TEST_ADMIN_EMAIL TEST_ADMIN_PASSWORD TEST_BUYER_EMAIL TEST_BUYER_PASSWORD \
                      TEST_SALES_EMAIL TEST_SALES_PASSWORD TEST_FINANCE_EMAIL TEST_FINANCE_PASSWORD \
                      TEST_ASSEMBLY_EMAIL TEST_ASSEMBLY_PASSWORD TEST_DISPATCH_EMAIL TEST_DISPATCH_PASSWORD \
                      TEST_OPERATIONS_EMAIL TEST_OPERATIONS_PASSWORD TEST_GATE_SECURITY_EMAIL TEST_GATE_SECURITY_PASSWORD \
                      TEST_RGS_EMAIL TEST_RGS_PASSWORD TEST_PRODUCTION_EMAIL TEST_PRODUCTION_PASSWORD \
                      TEST_TV_RGS_EMAIL TEST_TV_RGS_PASSWORD TEST_TV_PRODUCTION_EMAIL TEST_TV_PRODUCTION_PASSWORD \
                      TEST_AI_STUDIO_PREVIEW_URL TEST_TRACE_PREVIEW_URL; do
            if [[ -n "${!name:-}" ]]; then
              echo "present: $name"
            else
              echo "missing: $name"
            fi
          done

      - name: Configure post-merge targeted proofs (FAST PATH A/B — NOT current-main cert)
        if: env.RUN_TRANCHE == 'post-merge-proofs'
        shell: bash
        run: |
          set -euo pipefail
          echo "UAT_DEPLOY_BLOCKED=false" >> "$GITHUB_ENV"
          echo "FAST_PATH_493_URL=https://oasis-baklawa-centra-git-719166-oasisbaklawa2006-6222s-projects.vercel.app" >> "$GITHUB_ENV"
          echo "FAST_PATH_493_SHA=9715c20d8bc585948d15e7b74bc61b529d527061" >> "$GITHUB_ENV"
          echo "FAST_PATH_493_DEPLOYMENT_ID=7GCAJ79HNbN5oLDKtbVfefvjkg6q" >> "$GITHUB_ENV"
          echo "FAST_PATH_493_LABEL=FAIL-493-001 repair proof (#497 @ 9715c20d) — NOT original #493 cert" >> "$GITHUB_ENV"
          echo "FAST_PATH_491_URL=https://oasis-baklawa-central-adpz5kw86-oasisbaklawa2006-6222s-projects.vercel.app" >> "$GITHUB_ENV"
          echo "FAST_PATH_491_SHA=efd141944fd77aee58779209fe529497177d9118" >> "$GITHUB_ENV"
          echo "FAST_PATH_491_DEPLOYMENT_ID=6289622998" >> "$GITHUB_ENV"
          echo "UAT_CURRENT_MAIN_HOLD_SHA=64a107dfc167be76673a3d18f177a72472dcb241" >> "$GITHUB_ENV"
          echo "::notice::FAST PATH uses exact-head Vercel previews only. Current main 64a107df held — no stale ace340fe/67b3d1cc substitution."

      - name: Resolve and validate target URL (no secrets logged)
        if: env.RUN_TRANCHE != 'post-merge-proofs'
        shell: bash
        env:
          RAW_URL: ${{ env.TEST_PREVIEW_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="64a107dfc167be76673a3d18f177a72472dcb241"
          CONTINUATION_LEGACY_SHA="ace340fe1d122a4cce5d7bb61cd237ed7ba1c894"
          CONTINUATION_LEGACY_URL="https://oasis-baklawa-central-6zo99hosg-oasisbaklawa2006-6222s-projects.vercel.app"
          url="${RAW_URL:-}"
          resolved_sha=""
          continuation_fallback=false
          if [[ -z "$url" ]]; then
            echo "::notice::TEST_PREVIEW_URL secret missing — resolving deploy (current main first, then ace340fe continuation fallback for crawl tranches)."
            for sha in "${CURRENT_MAIN_SHA}" "${GITHUB_SHA}"; do
              deploy_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${sha}&per_page=10" --jq '[.[] | select(.environment=="Production" or .environment=="Preview")][0].id // empty' 2>/dev/null || true)"
              if [[ -n "$deploy_id" ]]; then
                url="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deploy_id}/statuses" --jq '[.[] | select(.state=="success")][0].target_url // empty' 2>/dev/null || true)"
                if [[ -n "$url" ]]; then
                  resolved_sha="$sha"
                  echo "Resolved deploy URL for ${sha}: $url"
                  break
                fi
              fi
            done
            if [[ -z "$url" && ( "${RUN_TRANCHE}" == "all" || "${RUN_TRANCHE}" == "continue" || "${RUN_TRANCHE}" == "auth-rerun" || "${RUN_TRANCHE}" == "tranche-03" || "${RUN_TRANCHE}" == "both" || "${RUN_TRANCHE}" == "post-fix-483" || "${RUN_TRANCHE}" == "buyer-mobile" || "${RUN_TRANCHE}" == "ai-uat" ) ]]; then
              echo "::notice::Current main ${CURRENT_MAIN_SHA} has no deploy — using ace340fe continuation fallback (NOT current-main certification)."
              deploy_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${CONTINUATION_LEGACY_SHA}&per_page=10" --jq '[.[] | select(.environment=="Production" or .environment=="Preview")][0].id // empty' 2>/dev/null || true)"
              if [[ -n "$deploy_id" ]]; then
                url="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deploy_id}/statuses" --jq '[.[] | select(.state=="success")][0].target_url // empty' 2>/dev/null || true)"
              fi
              if [[ -z "$url" ]]; then
                url="${CONTINUATION_LEGACY_URL}"
              fi
              resolved_sha="${CONTINUATION_LEGACY_SHA}"
              continuation_fallback=true
            fi
          else
            resolved_sha="${CURRENT_MAIN_SHA}"
          fi
          echo "UAT_TARGET_SHA=${CURRENT_MAIN_SHA}" >> "$GITHUB_ENV"
          echo "UAT_CONTINUATION_FALLBACK=${continuation_fallback}" >> "$GITHUB_ENV"
          if [[ "$continuation_fallback" == "true" ]]; then
            echo "UAT_DEPLOY_PROVENANCE_LABEL=ace340fe continuation crawl — NOT current-main 64a107df certification; post-merge FAIL-493 evidence preserved separately." >> "$GITHUB_ENV"
          fi
          if [[ -z "$url" ]]; then
            echo "::warning::No trusted Vercel deployment for current main ${CURRENT_MAIN_SHA} and no continuation fallback available."
            echo "UAT_DEPLOY_BLOCKED=true" >> "$GITHUB_ENV"
            echo "UAT_DEPLOY_BLOCK_REASON=No successful Vercel deployment for ${CURRENT_MAIN_SHA} (Vercel rate limit suspected); continuation fallback not applicable for tranche ${RUN_TRANCHE}." >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$url" == *$'\n'* || "$url" == *$'\r'* ]]; then
            echo "::error::Target URL contains newline — refusing."
            exit 1
          fi
          host="$(python3 -c "import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname or '')" "$url")"
          echo "Target host: $host"
          if [[ "$host" == "b2b.oasisbaklawa.com" || "$host" == "localhost" || "$host" == "127.0.0.1" || "$host" == *".vercel.app" ]]; then
            echo "Target host approved for UAT crawl."
          else
            echo "::error::Target host $host not in approved UAT crawl allowlist (production, localhost, *.vercel.app)."
            exit 1
          fi
          echo "UAT_DEPLOY_BLOCKED=false" >> "$GITHUB_ENV"
          echo "UAT_RESOLVED_DEPLOY_SHA=${resolved_sha}" >> "$GITHUB_ENV"
          echo "TEST_PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "UAT_CRAWL_BASE_URL=$url" >> "$GITHUB_ENV"
          if [[ "$host" == "b2b.oasisbaklawa.com" ]]; then
            echo "UAT_CRAWL_PRODUCTION=true" >> "$GITHUB_ENV"
          fi

      - name: Record deploy BLOCKED (current main — no trusted URL)
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED == 'true'
        run: node scripts/uat-crawl/record-deploy-blocked.mjs

      - name: Record continuation deploy provenance (ace340fe fallback)
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED != 'true' && env.UAT_CONTINUATION_FALLBACK == 'true'
        run: node scripts/uat-crawl/record-continuation-provenance.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        if: env.UAT_DEPLOY_BLOCKED != 'true' || env.RUN_TRANCHE == 'post-merge-proofs'
        run: npm install

      - name: Install Playwright Chromium
        if: env.UAT_DEPLOY_BLOCKED != 'true' || env.RUN_TRANCHE == 'post-merge-proofs'
        run: npx playwright install --with-deps chromium

      - name: FAST PATH A — #493 UAT-005 security regression
        if: env.RUN_TRANCHE == 'post-merge-proofs'
        id: fast_path_a_005
        continue-on-error: true
        env:
          TEST_PREVIEW_URL: https://oasis-baklawa-centra-git-719166-oasisbaklawa2006-6222s-projects.vercel.app
          UAT_CRAWL_BASE_URL: https://oasis-baklawa-centra-git-719166-oasisbaklawa2006-6222s-projects.vercel.app
          FAST_PATH_493_SHA: 9715c20d8bc585948d15e7b74bc61b529d527061
          FAST_PATH_493_DEPLOYMENT_ID: "7GCAJ79HNbN5oLDKtbVfefvjkg6q"
          FAST_PATH_493_URL: https://oasis-baklawa-centra-git-719166-oasisbaklawa2006-6222s-projects.vercel.app
          TEST_DISPATCH_EMAIL: ${{ secrets.TEST_DISPATCH_EMAIL }}
          TEST_DISPATCH_PASSWORD: ${{ secrets.TEST_DISPATCH_PASSWORD }}
          TEST_ASSEMBLY_EMAIL: ${{ secrets.TEST_ASSEMBLY_EMAIL }}
          TEST_ASSEMBLY_PASSWORD: ${{ secrets.TEST_ASSEMBLY_PASSWORD }}
        run: |
          set +e
          npx playwright test -c playwright.ai-uat.config.ts tests/ai-uat/tranche1.spec.ts -g "UAT-005"
          PW_EXIT=$?
          node scripts/merge-ai-uat-report.mjs || true
          node scripts/uat-crawl/archive-post-merge-493-proof.mjs || true
          exit $PW_EXIT

      - name: FAST PATH A — #493 UAT-006–010 (after UAT-005 PASS)
        if: env.RUN_TRANCHE == 'post-merge-proofs' && steps.fast_path_a_005.outcome == 'success'
        continue-on-error: true
        env:
          TEST_PREVIEW_URL: https://oasis-baklawa-centra-git-719166-oasisbaklawa2006-6222s-projects.vercel.app
          FAST_PATH_493_SHA: 9715c20d8bc585948d15e7b74bc61b529d527061
          FAST_PATH_493_DEPLOYMENT_ID: "7GCAJ79HNbN5oLDKtbVfefvjkg6q"
          FAST_PATH_493_URL: https://oasis-baklawa-centra-git-719166-oasisbaklawa2006-6222s-projects.vercel.app
          TEST_DISPATCH_EMAIL: ${{ secrets.TEST_DISPATCH_EMAIL }}
          TEST_DISPATCH_PASSWORD: ${{ secrets.TEST_DISPATCH_PASSWORD }}
          TEST_ASSEMBLY_EMAIL: ${{ secrets.TEST_ASSEMBLY_EMAIL }}
          TEST_ASSEMBLY_PASSWORD: ${{ secrets.TEST_ASSEMBLY_PASSWORD }}
        run: |
          npx playwright test -c playwright.ai-uat.config.ts tests/ai-uat/tranche1.spec.ts -g "UAT-006|UAT-007|UAT-008|UAT-009|UAT-010"
          node scripts/merge-ai-uat-report.mjs
          node scripts/uat-crawl/archive-post-merge-493-proof.mjs --append

      - name: FAST PATH B — #491 KPI regression (synthetic fixture)
        if: env.RUN_TRANCHE == 'post-merge-proofs'
        continue-on-error: true
        env:
          TEST_PREVIEW_URL: https://oasis-baklawa-central-adpz5kw86-oasisbaklawa2006-6222s-projects.vercel.app
          UAT_CRAWL_BASE_URL: https://oasis-baklawa-central-adpz5kw86-oasisbaklawa2006-6222s-projects.vercel.app
          FAST_PATH_491_SHA: efd141944fd77aee58779209fe529497177d9118
          FAST_PATH_491_DEPLOYMENT_ID: "6289622998"
          TEST_SALES_EMAIL: ${{ secrets.TEST_SALES_EMAIL }}
          TEST_SALES_PASSWORD: ${{ secrets.TEST_SALES_PASSWORD }}
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/post-merge-491-kpi.spec.ts

      - name: Run APPVERSE AI-UAT Tranche 1 (UAT-001–010)
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED != 'true' && (env.RUN_TRANCHE == 'ai-uat' || env.RUN_TRANCHE == 'all')
        continue-on-error: true
        env:
          TEST_DISPATCH_EMAIL: ${{ secrets.TEST_DISPATCH_EMAIL }}
          TEST_DISPATCH_PASSWORD: ${{ secrets.TEST_DISPATCH_PASSWORD }}
          TEST_ASSEMBLY_EMAIL: ${{ secrets.TEST_ASSEMBLY_EMAIL }}
          TEST_ASSEMBLY_PASSWORD: ${{ secrets.TEST_ASSEMBLY_PASSWORD }}
        run: |
          npx playwright test -c playwright.ai-uat.config.ts
          node scripts/merge-ai-uat-report.mjs
          node scripts/uat-crawl/archive-ai-uat-evidence.mjs

      - name: Run post-fix #483 buyer approval re-test (UAT-0018 + UAT-0020)
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED != 'true' && (env.RUN_TRANCHE == 'post-fix-483' || env.RUN_TRANCHE == 'all')
        continue-on-error: true
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/post-fix-483-rerun.spec.ts

      - name: Run authenticated UAT auth-rerun
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED != 'true' && (env.RUN_TRANCHE == 'auth-rerun' || env.RUN_TRANCHE == 'both' || env.RUN_TRANCHE == 'all')
        continue-on-error: true
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/auth-rerun.spec.ts

      - name: Run UAT tranche 03 (chronological continue)
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED != 'true' && (env.RUN_TRANCHE == 'tranche-03' || env.RUN_TRANCHE == 'both' || env.RUN_TRANCHE == 'all')
        continue-on-error: true
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/tranche-03-crawl.spec.ts

      - name: Run UAT tranche 04-auth (UAT-0031..0050)
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED != 'true' && (env.RUN_TRANCHE == 'all' || env.RUN_TRANCHE == 'continue')
        continue-on-error: true
        env:
          UAT_TRANCHE_START: UAT-0031
          UAT_TRANCHE_END: UAT-0050
          UAT_TRANCHE_LABEL: tranche-04-auth
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/tranche-auth-range.spec.ts

      - name: Run UAT tranche 05-auth (UAT-0051..0070)
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED != 'true' && (env.RUN_TRANCHE == 'all' || env.RUN_TRANCHE == 'continue')
        continue-on-error: true
        env:
          UAT_TRANCHE_START: UAT-0051
          UAT_TRANCHE_END: UAT-0070
          UAT_TRANCHE_LABEL: tranche-05-auth
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/tranche-auth-range.spec.ts

      - name: Run UAT tranche 06-auth (UAT-0071..0090)
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED != 'true' && (env.RUN_TRANCHE == 'all' || env.RUN_TRANCHE == 'continue')
        continue-on-error: true
        env:
          UAT_TRANCHE_START: UAT-0071
          UAT_TRANCHE_END: UAT-0090
          UAT_TRANCHE_LABEL: tranche-06-auth
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/tranche-auth-range.spec.ts

      - name: Run UAT tranche 07-auth (UAT-0091..0110)
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED != 'true' && (env.RUN_TRANCHE == 'all' || env.RUN_TRANCHE == 'continue')
        continue-on-error: true
        env:
          UAT_TRANCHE_START: UAT-0091
          UAT_TRANCHE_END: UAT-0110
          UAT_TRANCHE_LABEL: tranche-07-auth
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/tranche-auth-range.spec.ts

      - name: Run UAT tranche 08-auth (UAT-0111..0131)
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED != 'true' && (env.RUN_TRANCHE == 'all' || env.RUN_TRANCHE == 'continue')
        continue-on-error: true
        env:
          UAT_TRANCHE_START: UAT-0111
          UAT_TRANCHE_END: UAT-0131
          UAT_TRANCHE_LABEL: tranche-08-auth
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/tranche-auth-range.spec.ts

      - name: Run buyer mobile authenticated UAT (PR #10 surfaces)
        if: env.RUN_TRANCHE != 'post-merge-proofs' && env.UAT_DEPLOY_BLOCKED != 'true' && (env.RUN_TRANCHE == 'buyer-mobile' || env.RUN_TRANCHE == 'all')
        continue-on-error: true
        env:
          UAT_BUYER_BASELINE_SHA: "0015e7b56532826a40c7beb3f33b028271c2c2f5"
        run: npx playwright test -c playwright.uat-crawl.config.ts tests/uat-crawl/buyer-mobile-crawl.spec.ts

      - name: Write run metadata for commit job
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/uat-crawl
          cat > docs/uat-crawl/UAT_GHA_RUN.json <<EOF
          {
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "runTranche": "${RUN_TRANCHE}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "currentMainHoldSha": "${UAT_TARGET_SHA:-64a107dfc167be76673a3d18f177a72472dcb241}",
            "resolvedDeploySha": "${UAT_RESOLVED_DEPLOY_SHA:-}",
            "continuationFallback": ${UAT_CONTINUATION_FALLBACK:-false},
            "deployProvenanceLabel": "${UAT_DEPLOY_PROVENANCE_LABEL:-}",
            "deployBlocked": ${UAT_DEPLOY_BLOCKED:-false},
            "deployUrl": "${TEST_PREVIEW_URL:-}",
            "fail493RepairPreserved": "9715c20d (#497 preview PASS run 34016393457) — fa3b879 is newer #497 head but NOT current-main cert while #497 open",
            "completedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload UAT evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-crawl-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            uat-evidence/screenshots/
            docs/uat-crawl/UAT_MANIFEST*.jsonl
            docs/uat-crawl/UAT_INDEX*.md
            docs/uat-crawl/UAT_AUTH_RERUN_SUMMARY.json
            docs/uat-crawl/UAT_POST_FIX_483_SUMMARY.json
            docs/uat-crawl/UAT_GHA_RUN.json
            docs/uat-crawl/UAT_BUYER_MOBILE_SUMMARY.json
            docs/uat-crawl/UAT_BUYER_MOBILE_TARGETS.json
            docs/uat-crawl/UAT_MANIFEST_AI_UAT.jsonl
            docs/uat-crawl/UAT_AI_UAT_SUMMARY.json
            docs/uat-crawl/UAT_AI_UAT_REPORT.md
            docs/uat-crawl/UAT_DEPLOY_PROVENANCE.json
            docs/uat-crawl/UAT_POST_MERGE_493_PROOF.jsonl
            docs/uat-crawl/UAT_POST_MERGE_493_SUMMARY.json
            docs/uat-crawl/UAT_POST_MERGE_493_REPORT.md
            docs/uat-crawl/UAT_POST_MERGE_491_PROOF.jsonl
            docs/uat-crawl/UAT_POST_MERGE_491_SUMMARY.json
            uat-evidence/screenshots/post-merge-491-kpi/
            test-results/ai-uat-evidence.jsonl
          if-no-files-found: warn
          retention-days: 30

  commit-evidence:
    name: Commit UAT evidence to branch
    needs: uat-crawl
    if: always() && needs.uat-crawl.result != 'cancelled' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: uat-crawl-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact-download

      - name: Commit manifests and screenshots
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in artifact-download/*/; do
            cp -a "${dir}"* .
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            uat-evidence/screenshots \
            docs/uat-crawl/UAT_MANIFEST*.jsonl docs/uat-crawl/UAT_INDEX*.md \
            docs/uat-crawl/UAT_AUTH_RERUN_SUMMARY.json docs/uat-crawl/UAT_POST_FIX_483_SUMMARY.json \
            docs/uat-crawl/UAT_GHA_RUN.json docs/uat-crawl/UAT_FAILURE_LEDGER.md docs/uat-crawl/UAT_CRAWL_PROGRESS.md \
            docs/uat-crawl/UAT_BUYER_MOBILE_SUMMARY.json docs/uat-crawl/UAT_BUYER_MOBILE_TARGETS.json \
            docs/uat-crawl/UAT_AI_UAT_SUMMARY.json docs/uat-crawl/UAT_AI_UAT_REPORT.md docs/uat-crawl/UAT_DEPLOY_PROVENANCE.json \
            docs/uat-crawl/UAT_POST_MERGE_493_PROOF.jsonl docs/uat-crawl/UAT_POST_MERGE_493_SUMMARY.json docs/uat-crawl/UAT_POST_MERGE_493_REPORT.md \
            docs/uat-crawl/UAT_POST_MERGE_491_PROOF.jsonl docs/uat-crawl/UAT_POST_MERGE_491_SUMMARY.json \
            docs/uat-crawl/UAT_REBASE_490_SUMMARY.json uat-evidence/screenshots/post-merge-491-kpi; do
            [ -e "$path" ] && git add "$path" || true
          done
          if git diff --staged --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "UAT evidence from GHA run ${{ github.run_id }} (tranche ${{ needs.uat-crawl.outputs.run_tranche || 'all' }})"
          git push
