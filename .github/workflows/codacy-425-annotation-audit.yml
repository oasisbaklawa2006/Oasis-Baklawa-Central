name: PR 425 Codacy Annotation Audit

on:
  push:
    branches:
      - chatgpt/pr425-codacy-corrective

permissions:
  contents: write
  checks: read

jobs:
  audit-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v4

      - name: Print exact Codacy annotations from merged head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --paginate \
            /repos/oasisbaklawa2006/Oasis-Baklawa-Central/check-runs/100174381676/annotations \
          | jq -r '.[] | [(.annotation_level // ""), (.path // ""), ((.start_line // 0)|tostring), ((.end_line // 0)|tostring), (.title // ""), (.message // ""), (.raw_details // "")] | @tsv'

      - name: Apply exact event-handler corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/admin/AdminB2bSecurityGate.tsx")
          text = path.read_text()
          replacements = [
              (
                  '    return () => window.clearInterval(timer);',
                  '    return () => {\n      window.clearInterval(timer);\n    };',
              ),
              (
                  '        <form onSubmit={handleScan} className="mt-10 w-full max-w-xl">',
                  '        <form onSubmit={(event) => { void handleScan(event); }} className="mt-10 w-full max-w-xl">',
              ),
              (
                  'onChange={(event) => setInput(event.target.value)}',
                  'onChange={(event) => { setInput(event.target.value); }}',
              ),
              (
                  'onChange={(e) => setTransporter(e.target.value)}',
                  'onChange={(event) => { setTransporter(event.target.value); }}',
              ),
              (
                  'onChange={(e) => setTransportMode(e.target.value as DispatchTransportMode)}',
                  'onChange={(event) => { setTransportMode(event.target.value as DispatchTransportMode); }}',
              ),
              (
                  'onChange={(e) => setLrAwbBilty(e.target.value)}',
                  'onChange={(event) => { setLrAwbBilty(event.target.value); }}',
              ),
              (
                  'onChange={(e) => setVehicleNumber(e.target.value)}',
                  'onChange={(event) => { setVehicleNumber(event.target.value); }}',
              ),
              (
                  'onChange={(e) => setDriverName(e.target.value)}',
                  'onChange={(event) => { setDriverName(event.target.value); }}',
              ),
              (
                  'onChange={(e) => setDriverPhone(e.target.value)}',
                  'onChange={(event) => { setDriverPhone(event.target.value); }}',
              ),
              (
                  'onChange={(e) => setTrackingReference(e.target.value)}',
                  'onChange={(event) => { setTrackingReference(event.target.value); }}',
              ),
              (
                  'onChange={(e) => setDispatchEvidence(e.target.value)}',
                  'onChange={(event) => { setDispatchEvidence(event.target.value); }}',
              ),
              (
                  'onChange={(e) => setDispatchedAt(e.target.value)}',
                  'onChange={(event) => { setDispatchedAt(event.target.value); }}',
              ),
              (
                  'onClick={() => void freezeDispatchProof()}',
                  'onClick={() => { void freezeDispatchProof(); }}',
              ),
              (
                  '    if (!user?.id) return toast.error("Authenticated dispatch/gate actor required");',
                  '    if (!user?.id) {\n      toast.error("Authenticated dispatch/gate actor required");\n      return;\n    }',
              ),
              (
                  '    if (evidenceReferences.length === 0) return toast.error("At least one dispatch evidence reference is required");',
                  '    if (evidenceReferences.length === 0) {\n      toast.error("At least one dispatch evidence reference is required");\n      return;\n    }',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence, found {count}: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit corrective source change
        run: |
          if git diff --quiet -- src/pages/admin/AdminB2bSecurityGate.tsx; then
            echo "Corrective patch already present."
            exit 0
          fi
          git config user.name "Oasis Appverse Mission Control"
          git config user.email "oasisbaklawa2006@gmail.com"
          git add src/pages/admin/AdminB2bSecurityGate.tsx
          git commit -m "fix(gate): clear PR 425 Codacy event handler findings"
          git push
