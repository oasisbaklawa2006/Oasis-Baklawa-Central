name: Repo Ownership Boundaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repo-boundaries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-boundaries:
    name: Enforce Catalogue AI-Studio repo ownership boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check repo ownership boundaries
        run: npm run check:boundaries

      - name: Regression-test ownership boundaries
        run: bash scripts/tests/verify-repo-boundaries.sh
