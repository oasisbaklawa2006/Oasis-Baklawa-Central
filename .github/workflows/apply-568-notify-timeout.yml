name: Apply 568 notification timeout

on:
  push:
    branches:
      - fix/561-prelogin-b2b-apply-v2
    paths:
      - .github/workflows/apply-568-notify-timeout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/561-prelogin-b2b-apply-v2
          fetch-depth: 0
      - name: Apply bounded timeout repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          notify = Path('src/utils/notifyEvent.ts')
          text = notify.read_text()
          old = '''export const notifyEvent = async (params: NotifyEventParams) => {\n'''
          new = '''export interface NotifyEventOptions {\n  timeoutMs?: number;\n}\n\nexport const notifyEvent = async (params: NotifyEventParams, options: NotifyEventOptions = {}) => {\n'''
          if old not in text:
              raise SystemExit('notifyEvent signature marker not found')
          text = text.replace(old, new, 1)
          old = '''    const { data, error } = await supabase.functions.invoke("notify-event", {\n      body: params,\n    });\n'''
          new = '''    const timeout = options.timeoutMs ?? 10_000;\n    const { data, error } = await supabase.functions.invoke("notify-event", {\n      body: params,\n      timeout,\n    });\n'''
          if old not in text:
              raise SystemExit('invoke marker not found')
          notify.write_text(text.replace(old, new, 1))

          admin = Path('src/pages/admin/AdminClients.tsx')
          text = admin.read_text()
          old = '''      const approvalNotification = await notifyEvent({\n        event: "approval_granted",\n        applicationId: app.id,\n      });\n'''
          new = '''      const approvalNotification = await notifyEvent({\n        event: "approval_granted",\n        applicationId: app.id,\n      }, { timeoutMs: 10_000 });\n'''
          if old not in text:
              raise SystemExit('AdminClients notification marker not found')
          admin.write_text(text.replace(old, new, 1))

          test = Path('src/lib/notification-infrastructure/__tests__/b2bApprovalNotificationAuthority.test.ts')
          t = test.read_text()
          marker = '''    expect(adminSource).not.toContain("email: app.contact_email");\n  });\n'''
          replacement = '''    expect(adminSource).not.toContain("email: app.contact_email");\n    expect(adminSource).toContain("{ timeoutMs: 10_000 }");\n  });\n'''
          if marker not in t:
              raise SystemExit('timeout test marker not found')
          test.write_text(t.replace(marker, replacement, 1))
          PY

          rm .github/workflows/apply-568-notify-timeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/notifyEvent.ts src/pages/admin/AdminClients.tsx src/lib/notification-infrastructure/__tests__/b2bApprovalNotificationAuthority.test.ts .github/workflows/apply-568-notify-timeout.yml
          git commit -m "fix(b2b): bound approval notification wait"
          git push origin HEAD:fix/561-prelogin-b2b-apply-v2
