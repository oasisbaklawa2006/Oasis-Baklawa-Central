name: Execute 561 pre-login patch

on:
  push:
    branches:
      - fix/561-prelogin-b2b-apply-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/561-prelogin-b2b-apply-v2
          fetch-depth: 0
      - name: Execute bounded patch body
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source_path = Path('.github/workflows/apply-561-prelogin-patch.yml')
          lines = source_path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = []
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          exec(compile('\n'.join(body), str(source_path), 'exec'))
          Path('.github/workflows/apply-561-prelogin-patch-v2.yml').unlink()
          PY
      - name: Commit bounded patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(b2b): restore governed pre-login access flow"
          git push origin HEAD:fix/561-prelogin-b2b-apply-v2
