name: Apply 561 pre-login patch

on:
  push:
    branches:
      - fix/561-prelogin-b2b-apply-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(b2b): restore governed pre-login access flow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/561-prelogin-b2b-apply-v2
          fetch-depth: 0

      - name: Apply bounded source transformations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Login CTA: public Apply opens the public application directly.
          replace_once(
              "src/pages/Login.tsx",
              '''  // Issue #561: the B2B access CTA routed to a nonexistent /register (404).\n  // It now runs the governed mobile-verification identity gate instead of any\n  // anonymous application write.\n  const handleApplyForB2BAccess = () => {\n    setActiveTab("msg91");\n    launchMsg91Widget();\n  };''',
              '''  // Issue #561: B2B application is a governed pre-login intake.\n  // Prospects may open the form directly; Core owns the anonymous write boundary.\n  const handleApplyForB2BAccess = () => {\n    navigate("/buyer/access-request");\n  };''',
          )

          # An email-login attempt by a prospect that has no usable account converges
          # on the same public application instead of stranding on the login screen.
          replace_once(
              "src/pages/Login.tsx",
              '''      await finalizeFailure(message.includes("Invalid") ? "Invalid email or password." : getCustomerAuthUserMessage(error), "failed");\n      return;''',
              '''      await finalizeFailure(message.includes("Invalid") ? "Login was not available for this account. You can request B2B access." : getCustomerAuthUserMessage(error), "failed");\n      navigate("/buyer/access-request");\n      return;''',
          )

          # Public route: form itself is pre-login; write remains governed by Core RPC.
          replace_once(
              "src/App.tsx",
              '''<Route path="/buyer/access-request" element={<ProtectedRoute><BuyerAccessRequest /></ProtectedRoute>} />''',
              '''<Route path="/buyer/access-request" element={<BuyerAccessRequest />} />''',
          )

          # A verified-but-unapproved identity also converges on the application.
          replace_once(
              "src/App.tsx",
              '''}): "/customer-app-redirect" {\n  return "/customer-app-redirect";\n}''',
              '''}): "/buyer/access-request" {\n  return "/buyer/access-request";\n}''',
          )

          # Auth-flow unresolved accounts route to the application, not the legacy gate.
          replace_once(
              "src/lib/auth-flow.ts",
              '''    return "/customer-app-redirect";''',
              '''    return "/buyer/access-request";''',
          )
          p = Path("src/lib/auth-flow.ts")
          text = p.read_text().replace(
              "existing unresolved-account redirect can send it to /customer-app-redirect.",
              "unresolved-account redirect can send it to /buyer/access-request.",
          )
          p.write_text(text)

          # Frontend binding: consume the already-deployed Core #275 v2 pre-login RPC.
          p = Path("src/lib/customerApp/customerAppClient.ts")
          text = p.read_text()
          start = text.index("  submitApplication: (input: {")
          end = text.index("  submitTicket:", start)
          replacement = '''  submitApplication: (input: {\n    businessName: string;\n    contactName: string;\n    contactEmail: string;\n    contactPhone: string;\n    gstNumber?: string;\n    address?: string;\n    preferredDispatch?: string | null;\n    preferredDispatchOtherName?: string | null;\n  }) => rpc("submit_b2b_access_request_v2", {\n    p_business_name: input.businessName,\n    p_contact_name: input.contactName,\n    p_contact_email: input.contactEmail,\n    p_contact_phone: input.contactPhone,\n    p_gst_number: input.gstNumber || null,\n    p_registered_address: input.address || null,\n    p_preferred_dispatch: input.preferredDispatch || null,\n    p_preferred_dispatch_other_name: input.preferredDispatchOtherName || null,\n    p_trade_declaration: true,\n    p_data_consent: true,\n  }),\n'''
          p.write_text(text[:start] + replacement + text[end:])

          # Add the deployed Core function to Central's generated-function contract.
          p = Path("src/integrations/supabase/database.types.ts")
          text = p.read_text()
          if "submit_b2b_access_request_v2:" not in text:
              needle = "  submit_b2b_trade_application_v1:"
              if text.count(needle) != 1:
                  raise SystemExit(f"database.types.ts: expected one {needle!r}, got {text.count(needle)}")
              entry = '''  submit_b2b_access_request_v2: { Args: { p_business_name: string; p_contact_name: string; p_contact_email: string; p_contact_phone: string; p_gst_number?: string | null; p_registered_address?: string | null; p_preferred_dispatch?: string | null; p_preferred_dispatch_other_name?: string | null; p_trade_declaration?: boolean; p_data_consent?: boolean }; Returns: { application_id: string; application_status: string; duplicate: boolean }[] }\n'''
              text = text.replace(needle, entry + needle, 1)
              p.write_text(text)

          # Customer confirmation reflects Pending -> approval -> notification semantics.
          replace_once(
              "src/pages/customer/BuyerApp.tsx",
              '''Our team will review your company details and activate Buyer access when approved.''',
              '''Your B2B application is pending internal approval. We will notify you through an available WhatsApp, SMS, or email channel after approval. Buyer login becomes available only after approval.''',
          )

          # Replace the obsolete OTP-first CTA contract with the authoritative public-Apply contract.
          Path("src/pages/__tests__/loginB2bAccessCta.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\n\nconst source = readFileSync("src/pages/Login.tsx", "utf8");\nconst ctaHandlerName = "handleApplyForB2BAccess";\n\ndescribe("Login / Apply for B2B Access CTA", () => {\n  it("never navigates to the deleted /register route", () => {\n    expect(source).not.toContain('"/register"');\n    expect(source).not.toContain("'/register'");\n  });\n\n  it("binds the CTA to the dedicated handler", () => {\n    expect(source).toContain(`onClick={${ctaHandlerName}}`);\n    expect(source).toContain("Apply for B2B Access");\n  });\n\n  it("opens the governed pre-login B2B application directly without forcing OTP", () => {\n    const handler = source.slice(source.indexOf(`const ${ctaHandlerName} = `));\n    const body = handler.slice(0, handler.indexOf("};") + 2);\n    expect(body).toContain('navigate("/buyer/access-request")');\n    expect(body).not.toContain('setActiveTab("msg91")');\n    expect(body).not.toContain("launchMsg91Widget()");\n  });\n});\n''')

          # Update unresolved-account redirect tests to the new application destination.
          p = Path("src/lib/__tests__/auth-flow.test.ts")
          text = p.read_text()
          text = text.replace("survives and lands on /customer-app-redirect.", "survives and lands on /buyer/access-request.")
          text = text.replace("enters /customer-app-redirect", "enters /buyer/access-request")
          text = text.replace('expect(getPostLoginRedirectOnError(error)).toBe("/customer-app-redirect");', 'expect(getPostLoginRedirectOnError(error)).toBe("/buyer/access-request");')
          old = '''  it("matches the destination used for unresolved/unknown staff roles", () => {\n    expect(getPostLoginRedirectOnError(new AuthFlowError("ROLE_NOT_ASSIGNED", "x"))).toBe(getRoleDestination(null));\n    expect(getPostLoginRedirectOnError(new AuthFlowError("ACCOUNT_PENDING", "x"))).toBe(getRoleDestination("PENDING"));\n  });\n\n'''
          text = text.replace(old, '''  it("converges unresolved Buyer onboarding on the public access-request surface", () => {\n    expect(getPostLoginRedirectOnError(new AuthFlowError("ROLE_NOT_ASSIGNED", "x"))).toBe("/buyer/access-request");\n    expect(getPostLoginRedirectOnError(new AuthFlowError("ACCOUNT_PENDING", "x"))).toBe("/buyer/access-request");\n  });\n\n''')
          text = text.replace('expect(destination).toBe("/customer-app-redirect");', 'expect(destination).toBe("/buyer/access-request");')
          # getRoleDestination is no longer used by this test file after the authoritative redirect change.
          text = text.replace('import { getRoleDestination } from "@/lib/auth-routing";\n', '')
          p.write_text(text)

          # Add source-contract regression for public route + v2 RPC + no legacy write binding.
          test_path = Path("src/pages/__tests__/b2bPreloginAccessContract.test.ts")
          test_path.write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\n\nconst appSource = readFileSync("src/App.tsx", "utf8");\nconst clientSource = readFileSync("src/lib/customerApp/customerAppClient.ts", "utf8");\nconst typeSource = readFileSync("src/integrations/supabase/database.types.ts", "utf8");\n\ndescribe("B2B pre-login access contract", () => {\n  it("keeps /buyer/access-request public while leaving the form on a named route", () => {\n    expect(appSource).toContain('<Route path="/buyer/access-request" element={<BuyerAccessRequest />} />');\n    expect(appSource).not.toContain('<Route path="/buyer/access-request" element={<ProtectedRoute>');\n  });\n\n  it("submits through Core v2 governed pre-login RPC", () => {\n    const start = clientSource.indexOf("  submitApplication: (input: {");\n    const end = clientSource.indexOf("  submitTicket:", start);\n    const block = clientSource.slice(start, end);\n    expect(block).toContain('rpc("submit_b2b_access_request_v2"');\n    expect(block).not.toContain("submit_b2b_trade_application_v1");\n    expect(block).toContain("p_trade_declaration: true");\n    expect(block).toContain("p_data_consent: true");\n  });\n\n  it("types the deployed v2 Core function in Central", () => {\n    expect(typeSource).toContain("submit_b2b_access_request_v2:");\n  });\n});\n''')

          # Remove this one-shot patch workflow from the final branch diff.
          Path(".github/workflows/apply-561-prelogin-patch.yml").unlink()
          PY

      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(b2b): restore governed pre-login access flow"
          git push origin HEAD:fix/561-prelogin-b2b-apply-v2
