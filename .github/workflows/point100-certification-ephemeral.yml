name: Point100 Final Software Dress Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/point100-certification-ephemeral.yml'
      - 'playwright.point100.config.ts'
      - 'scripts/point100-certification/**'
      - 'src/lib/point100/**'
      - 'tests/point100/**'
      - '.appverse/MACRO_POINT100_INTEGRATION_MISSION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: point100-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  point100-dress-rehearsal:
    name: Point100 production-bound software rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POINT100_CORE_REPO: ${{ github.workspace }}/oasis-supabase-core
      POINT100_ALLOW_LOCAL_RESET: "true"
      POINT100_ALLOW_DISPOSABLE_BOOTSTRAP: "false"
      POINT100_DISPATCH_PRODUCTION_VERIFIED: "true"
      POINT100_CORE_VERIFIED_SHA: da7506ad4b8f566f19bf40188ba4415a38361ba6
      POINT100_PRODUCTION_MIGRATION_RUN_ID: "34271047926"
      POINT100_RECERT_AFTER_CORE_MIGRATION_RUN_ID: "34271047926"
      FACTORY_CERT_CORE_REPO: ${{ github.workspace }}/oasis-supabase-core
      FACTORY_CERT_ALLOW_LOCAL_RESET: "true"
      FACTORY_CERT_CREDENTIAL_FILE: /tmp/oasis-factory-certification.env
      FACTORY_CERT_TARGET_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout Central
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout production-certified Core schema authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: oasisbaklawa2006/oasis-supabase-core
          ref: da7506ad4b8f566f19bf40188ba4415a38361ba6
          path: oasis-supabase-core

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.101.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Point100 scripts and exact production pin
        run: |
          bash -n scripts/point100-certification/start-ephemeral.sh
          bash -n scripts/point100-certification/stop-ephemeral.sh
          bash -n scripts/point100-certification/run-dress-rehearsal.sh
          bash -n scripts/point100-certification/recert-after-core-260.sh
          test "${POINT100_CORE_VERIFIED_SHA}" = "da7506ad4b8f566f19bf40188ba4415a38361ba6"
          test "${POINT100_PRODUCTION_MIGRATION_RUN_ID}" = "34271047926"
          test "${POINT100_ALLOW_DISPOSABLE_BOOTSTRAP}" = "false"

      - name: Unit tests (Point100 harness library)
        run: npm run test -- src/lib/point100

      - name: Start disposable database from exact production-certified Core source
        run: bash scripts/point100-certification/start-ephemeral.sh

      - name: Export local backend and disposable identities to this job only
        shell: bash
        run: |
          pushd oasis-supabase-core >/dev/null
          supabase status -o env > "${RUNNER_TEMP}/point100-supabase.env"
          popd >/dev/null
          # shellcheck disable=SC1090
          source "${RUNNER_TEMP}/point100-supabase.env"
          {
            echo "FACTORY_CERT_SUPABASE_URL=${API_URL}"
            echo "FACTORY_CERT_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "FACTORY_CERT_ENVIRONMENT_ID=point100-cert-gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_ENV}"

          while IFS= read -r cred_line; do
            if [[ "${cred_line}" =~ ^export\ ([A-Z0-9_]+)_PASSWORD=\'([^\']*)\'$ ]]; then
              echo "::add-mask::${BASH_REMATCH[2]}"
            fi
          done < "${FACTORY_CERT_CREDENTIAL_FILE}"

          sed -n -E "s/^export ([A-Z0-9_]+)='([^']*)'$/\1=\2/p" "${FACTORY_CERT_CREDENTIAL_FILE}" >> "${GITHUB_ENV}"

      - name: Build Central preview
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "${RUNNER_TEMP}/point100-preview.log" 2>&1 &
          preview_pid=$!
          echo "${preview_pid}" > "${RUNNER_TEMP}/point100-preview.pid"
          for _ in $(seq 1 60); do
            if ! kill -0 "${preview_pid}" >/dev/null 2>&1; then
              echo "Preview exited before ready" >&2
              cat "${RUNNER_TEMP}/point100-preview.log"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:4173/login >/dev/null; then
              echo "Point100 preview target is ready."
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/point100-preview.log"
          exit 1

      - name: Run Point100 full lifecycle and negative-path suite
        run: npx playwright test -c playwright.point100.config.ts

      - name: Upload Point100 artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: point100-certification-${{ github.run_id }}
          path: |
            point100-capability-matrix.json
            point100-dress-rehearsal-ledger.json
            point100-negative-paths-ledger.json
            point100-certification-results.json
          if-no-files-found: warn

      - name: Stop disposable backend
        if: always()
        run: bash scripts/point100-certification/stop-ephemeral.sh
