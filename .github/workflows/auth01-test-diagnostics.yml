name: AUTH-01 test diagnostics

on:
  push:
    branches:
      - fix/auth01-post-claim-role-race

permissions:
  contents: read

jobs:
  capture-unit-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture unit and migration contract output
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee auth01-unit-test.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth01-unit-test-${{ github.sha }}
          path: auth01-unit-test.log
          if-no-files-found: error
          retention-days: 1
