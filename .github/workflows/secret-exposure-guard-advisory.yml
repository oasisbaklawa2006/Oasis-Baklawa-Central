name: Secret Exposure Guard Advisory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-exposure-guard-advisory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  advisory-pr-scan:
    name: Scan tracked files for secret values (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout unprivileged PR merge revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Advisory scan using candidate scanner
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-tracked-secret-exposure.sh .
