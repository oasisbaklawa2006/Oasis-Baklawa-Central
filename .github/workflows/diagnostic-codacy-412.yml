name: Diagnostic Codacy 412

on:
  pull_request:
    paths:
      - '.github/workflows/diagnostic-codacy-412.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-codacy-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and persist public Codacy issue metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://api.codacy.com/api/v3/analysis/organizations/gh/oasisbaklawa2006/repositories/Oasis-Baklawa-Central/pull-requests/412/issues?status=new'
          issues="$(curl --fail --silent --show-error "$endpoint" \
            | jq '{data: [.data[] | {filePath, lineNumber, patternInfo, message, category, level}]}')"
          encoded="$(printf '%s\n' "$issues" | base64 -w0)"
          gh api \
            --method PUT \
            repos/oasisbaklawa2006/Oasis-Baklawa-Central/contents/.diagnostics/codacy-412.json \
            -f message='test: persist Codacy 412 diagnostic output' \
            -f content="$encoded" \
            -f branch='diagnostic/codacy-412-shell'
