name: Diagnostic Codacy 412

on:
  pull_request:
    paths:
      - '.github/workflows/diagnostic-codacy-412.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  fetch-codacy-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and publish public Codacy issue metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://api.codacy.com/api/v3/analysis/organizations/gh/oasisbaklawa2006/repositories/Oasis-Baklawa-Central/pull-requests/412/issues?status=new'
          issues="$(curl --fail --silent --show-error "$endpoint" \
            | jq -c '{data: [.data[] | {filePath, lineNumber, patternInfo, message, category, level}]}')"
          gh pr comment 416 --body "CODACY-412-DIAGNOSTIC: $issues"
