name: Secret Exposure Guard

# Point 3 / 3j — repository-wide guard against committed secret VALUES.
# Complements GitHub Secret Scanning (provider-side) and cert-workflow
# report-byte scans; does not replace provider rotation or alert closure.
#
# The authoritative PR job executes only trusted base-revision code. Candidate
# PR content is fetched as Git objects and inspected as data via `git show`;
# candidate files are never checked out or executed in pull_request_target.

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-exposure-guard-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  trusted-pr-scan:
    if: github.event_name == 'pull_request_target'
    name: Scan tracked files for secret values (trusted)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Materialize trusted base and inert PR head objects
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::Invalid PR number' >&2
            exit 1
          }
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Invalid PR base SHA' >&2
            exit 1
          }
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Invalid PR head SHA' >&2
            exit 1
          }

          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.file.allow=never fetch --no-tags --no-write-fetch-head origin "$PR_BASE_SHA"
          git update-ref refs/remotes/origin/trusted-base "$PR_BASE_SHA"
          git -c protocol.file.allow=never fetch --no-tags --no-write-fetch-head origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"

          fetched_head="$(git rev-parse refs/remotes/origin/pr-head)"
          [[ "$fetched_head" == "$PR_HEAD_SHA" ]] || {
            echo '::error::Fetched PR head does not match event SHA' >&2
            exit 1
          }

          git checkout --detach refs/remotes/origin/trusted-base
          [[ "$(git rev-parse HEAD)" == "$PR_BASE_SHA" ]] || {
            echo '::error::Trusted base checkout mismatch' >&2
            exit 1
          }

      - name: Assert no tracked high-confidence secret values using trusted scanner
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ -f scripts/check-tracked-secret-exposure.sh ]] || {
            echo '::error::Trusted base secret scanner is missing' >&2
            exit 1
          }
          bash scripts/check-tracked-secret-exposure.sh --git-ref "$PR_HEAD_SHA"

  branch-scan:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Scan tracked files for secret values
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert no tracked high-confidence secret values
        run: bash scripts/check-tracked-secret-exposure.sh .
