name: Secret Exposure Guard

# Point 3 / 3j — repository-wide guard against committed secret VALUES.
# Complements GitHub Secret Scanning (provider-side) and cert-workflow
# report-byte scans; does not replace provider rotation or alert closure.
#
# The authoritative PR job executes the scanner from the trusted base revision
# against a data-only checkout of the candidate tree. The scanner and this
# workflow are self-protected by Core Backend Authority after bootstrap.

on:
  pull_request_target:
    branches: [main]
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-exposure-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-pr-scan:
    if: github.event_name == 'pull_request_target'
    name: Scan tracked files for secret values (trusted)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Checkout candidate tree as data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Assert no tracked high-confidence secret values using trusted scanner
        shell: bash
        run: |
          set -euo pipefail
          [[ -f scripts/check-tracked-secret-exposure.sh ]] || {
            echo '::error::Trusted base secret scanner is missing' >&2
            exit 1
          }
          bash scripts/check-tracked-secret-exposure.sh candidate

  advisory-pr-scan:
    if: github.event_name == 'pull_request'
    name: Scan tracked files for secret values (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Advisory scan using candidate scanner
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-tracked-secret-exposure.sh .

  branch-scan:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Scan tracked files for secret values
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert no tracked high-confidence secret values
        run: bash scripts/check-tracked-secret-exposure.sh .
