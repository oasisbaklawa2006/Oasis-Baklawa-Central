name: Secret Exposure Guard

# Point 3 / 3j — repository-wide guard against committed secret VALUES.
# Complements GitHub Secret Scanning (provider-side) and cert-workflow
# report-byte scans; does not replace Resend rotation or alert closure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-exposure-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan-tracked-files:
    name: Scan tracked files for secret values
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no tracked high-confidence secret values
        run: bash scripts/check-tracked-secret-exposure.sh .
