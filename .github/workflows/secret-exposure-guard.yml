name: Secret Exposure Guard

# Point 3 / 3j — repository-wide guard against committed secret VALUES.
# Complements GitHub Secret Scanning (provider-side) and cert-workflow
# report-byte scans; does not replace provider rotation or alert closure.
#
# The authoritative PR job executes only trusted base-revision code. Candidate
# PR content is fetched as Git objects and inspected as data via `git show`;
# candidate files are never checked out or executed in pull_request_target.

on:
  pull_request_target:
    branches: [main]
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-exposure-guard-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-pr-scan:
    if: github.event_name == 'pull_request_target'
    name: Scan tracked files for secret values (trusted)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch candidate commit as inert Git object data
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Invalid candidate commit SHA' >&2
            exit 1
          }
          [[ "$PR_HEAD_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo '::error::Invalid candidate repository identity' >&2
            exit 1
          }
          git -c protocol.file.allow=never \
            fetch --no-tags --no-write-fetch-head --depth=1 \
            "https://github.com/${PR_HEAD_REPO}.git" "$PR_HEAD_SHA"
          git rev-parse --verify "${PR_HEAD_SHA}^{commit}" >/dev/null

      - name: Assert no tracked high-confidence secret values using trusted scanner
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ -f scripts/check-tracked-secret-exposure.sh ]] || {
            echo '::error::Trusted base secret scanner is missing' >&2
            exit 1
          }
          bash scripts/check-tracked-secret-exposure.sh --git-ref "$PR_HEAD_SHA"

  advisory-pr-scan:
    if: github.event_name == 'pull_request'
    name: Scan tracked files for secret values (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout unprivileged PR merge revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Advisory scan using candidate scanner
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-tracked-secret-exposure.sh .

  branch-scan:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Scan tracked files for secret values
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert no tracked high-confidence secret values
        run: bash scripts/check-tracked-secret-exposure.sh .
