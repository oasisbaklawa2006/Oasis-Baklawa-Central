name: Release Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, unit test, production build, and Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
            if [ "$BASE_SHA" = "$ZERO_SHA" ]; then
              BASE_SHA="$(git hash-object -t tree /dev/null)"
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE_SHA="HEAD^"
          else
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi

          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

          # Added/modified/renamed files only (excludes deletions), so retiring
          # migrations out of this repo doesn't itself trip the ownership check.
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD > /tmp/changed-files-non-deleted.txt

          has_match() {
            grep -Eq "$1" /tmp/changed-files.txt
          }

          APP=false
          UI=false
          MIGRATION=false
          TOOLING=false
          TESTS=false

          has_match '^(src/|public/|index.html$|vite\.config\.|tsconfig|package\.json$|package-lock\.json$)' && APP=true || true
          has_match '^(src/|public/|tests/.*\.(spec|test)\.(ts|tsx)$|playwright.*\.ts$)' && UI=true || true
          has_match '^(supabase/migrations/|supabase/uat/)' && MIGRATION=true || true
          has_match '^(\.github/workflows/|scripts/|eslint\.config\.|package\.json$|package-lock\.json$)' && TOOLING=true || true
          has_match '(^|/)(tests?|__tests__)/|\.(spec|test)\.(ts|tsx)$' && TESTS=true || true

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "ui=$UI" >> "$GITHUB_OUTPUT"
          echo "migration=$MIGRATION" >> "$GITHUB_OUTPUT"
          echo "tooling=$TOOLING" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"

      - name: Enforce canonical Supabase migration ownership
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^supabase/migrations/' /tmp/changed-files-non-deleted.txt; then
            echo 'BOUNDARY VIOLATION: active Supabase migrations are owned exclusively by oasisbaklawa2006/oasis-supabase-core.' >&2
            echo 'Move the reviewed migration and database tests to Core; Central may consume the resulting contract only.' >&2
            exit 1
          fi
          echo 'Canonical Supabase migration ownership passed.'

      - name: Setup Node
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.ui == 'true' || steps.changes.outputs.migration == 'true' || steps.changes.outputs.tooling == 'true' || steps.changes.outputs.tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.ui == 'true' || steps.changes.outputs.migration == 'true' || steps.changes.outputs.tooling == 'true' || steps.changes.outputs.tests == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.tooling == 'true'
        run: npm run typecheck

      - name: ESLint changed TypeScript files
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.tooling == 'true' || steps.changes.outputs.tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(grep -E '\.(ts|tsx)$' /tmp/changed-files.txt | while IFS= read -r file; do
            if [ -f "$file" ]; then
              printf '%s\n' "$file"
            fi
          done)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi
          npx eslint "${FILES[@]}"

      - name: Unit and migration contract tests
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.migration == 'true' || steps.changes.outputs.tooling == 'true' || steps.changes.outputs.tests == 'true'
        run: npm run test

      - name: APPVERSE release controller regression tests
        if: steps.changes.outputs.tooling == 'true'
        run: npm run test:release-controller

      - name: Production build
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.ui == 'true' || steps.changes.outputs.tooling == 'true'
        env:
          # Publishable/anon values only (never a service-role key) -- these
          # are safe to bake into a client bundle by Supabase's own design
          # (the live production site already ships this exact anon key to
          # every visitor's browser; real access control is RLS, not secrecy
          # of this value). Without these the built app's supabase-js client
          # throws "supabaseUrl is required" at module load in every browser
          # context, which silently broke this CI build's ability to render
          # ANY route -- including the ones visual-audit.spec.ts already
          # screenshots -- before this fix.
          VITE_SUPABASE_URL: https://tcxvcatsqqertcnycuop.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UbNV2X25YHY3cupjpoLsjw_RhlDG4f_
        run: npm run build

      - name: Install Chromium
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.ui == 'true' || steps.changes.outputs.tooling == 'true'
        run: npx playwright install --with-deps chromium

      - name: Start PR build locally
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.ui == 'true' || steps.changes.outputs.tooling == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Playwright PR smoke
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.ui == 'true' || steps.changes.outputs.tooling == 'true'
        env:
          APP_URL: http://127.0.0.1:4173
          TEST_PREVIEW_URL: http://127.0.0.1:4173
        run: npx playwright test tests/visual-audit.spec.ts --project=desktop-chrome-size --trace=on

      # Lane 1 (Central issue #368) authenticated e2e chain coverage
      # (tests/lane1-live-smoke.spec.ts) is deliberately NOT wired into this
      # automatic pull_request-triggered gate. It authenticates with real
      # production QA passwords; folding it in here would mean any commit on
      # any PR branch could modify this spec file (or the login page it
      # drives) to exfiltrate those live credentials to an attacker-chosen
      # host the moment CI runs, before any human reviews the diff -- a
      # same-repo-PR credential-exfiltration path with no mitigation, unlike
      # its existing home, lane1-live-smoke.yml, which is workflow_dispatch
      # -only and therefore requires a trusted maintainer to deliberately
      # trigger it against a fixed, non-overridable target
      # (https://b2b.oasisbaklawa.com only). This is a proven, real
      # incompatibility (flagged by CodeRabbit's security review on this PR)
      # -- not an oversight -- and is analogous to why
      # tests/lane2-pna-e2e-chain.spec.ts also stays off this gate. Making
      # Lane 1 B3 safe to promote would require a disposable non-production
      # tenant/credential set for PR-triggered runs, which is a separate,
      # larger change outside this PR's scope.

      - name: Docs-only fast pass
        if: steps.changes.outputs.app != 'true' && steps.changes.outputs.ui != 'true' && steps.changes.outputs.migration != 'true' && steps.changes.outputs.tooling != 'true' && steps.changes.outputs.tests != 'true'
        run: echo "Documentation-only or metadata-only change; expensive application checks skipped."

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.changes.outputs.app == 'true' || steps.changes.outputs.ui == 'true' || steps.changes.outputs.tooling == 'true') }}
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
