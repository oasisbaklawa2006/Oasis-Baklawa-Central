name: Release Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, unit test, production build, and Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="HEAD^"
          fi

          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

          has_match() {
            grep -Eq "$1" /tmp/changed-files.txt
          }

          APP=false
          UI=false
          MIGRATION=false
          TOOLING=false
          TESTS=false

          has_match '^(src/|public/|index.html$|vite\.config\.|tsconfig|package\.json$|package-lock\.json$)' && APP=true || true
          has_match '^(src/.*\.(tsx|css)$|public/|tests/.*\.(spec|test)\.(ts|tsx)$|playwright.*\.ts$)' && UI=true || true
          has_match '^(supabase/migrations/|supabase/uat/)' && MIGRATION=true || true
          has_match '^(\.github/workflows/|scripts/|eslint\.config\.|package\.json$|package-lock\.json$)' && TOOLING=true || true
          has_match '(^|/)(tests?|__tests__)/|\.(spec|test)\.(ts|tsx)$' && TESTS=true || true

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "ui=$UI" >> "$GITHUB_OUTPUT"
          echo "migration=$MIGRATION" >> "$GITHUB_OUTPUT"
          echo "tooling=$TOOLING" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.migration == 'true' || steps.changes.outputs.tooling == 'true' || steps.changes.outputs.tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.migration == 'true' || steps.changes.outputs.tooling == 'true' || steps.changes.outputs.tests == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.tooling == 'true'
        run: npm run typecheck

      - name: ESLint changed TypeScript files
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.tooling == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="HEAD^"
          fi

          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD | grep -E '\.(ts|tsx)$' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi

          npx eslint "${FILES[@]}"

      - name: Unit and migration contract tests
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.migration == 'true' || steps.changes.outputs.tooling == 'true' || steps.changes.outputs.tests == 'true'
        run: npm run test

      - name: Production build
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.tooling == 'true'
        run: npm run build

      - name: Install Chromium
        if: steps.changes.outputs.ui == 'true'
        run: npx playwright install chromium

      - name: Start PR build locally
        if: steps.changes.outputs.ui == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Playwright PR smoke
        if: steps.changes.outputs.ui == 'true'
        env:
          APP_URL: http://127.0.0.1:4173
          TEST_PREVIEW_URL: http://127.0.0.1:4173
        run: npx playwright test tests/visual-audit.spec.ts --project=desktop-chrome-size --trace=on

      - name: Docs-only fast pass
        if: steps.changes.outputs.app != 'true' && steps.changes.outputs.migration != 'true' && steps.changes.outputs.tooling != 'true' && steps.changes.outputs.tests != 'true'
        run: echo "Documentation-only or metadata-only change; expensive application checks skipped."

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.ui == 'true'
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
