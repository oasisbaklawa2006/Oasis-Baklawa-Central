name: Release Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, unit test, production build, and Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
            if [ "$BASE_SHA" = "$ZERO_SHA" ]; then
              BASE_SHA="$(git hash-object -t tree /dev/null)"
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE_SHA="HEAD^"
          else
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi

          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

          # Added/modified/renamed files only (excludes deletions), so retiring
          # migrations out of this repo doesn't itself trip the ownership check.
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD > /tmp/changed-files-non-deleted.txt

          has_match() {
            grep -Eq "$1" /tmp/changed-files.txt
          }

          APP=false
          UI=false
          MIGRATION=false
          TOOLING=false
          TESTS=false

          has_match '^(src/|public/|index.html$|vite\.config\.|tsconfig|package\.json$|package-lock\.json$)' && APP=true || true
          has_match '^(src/|public/|tests/.*\.(spec|test)\.(ts|tsx)$|playwright.*\.ts$)' && UI=true || true
          has_match '^(supabase/migrations/|supabase/uat/)' && MIGRATION=true || true
          has_match '^(\.github/workflows/|scripts/|eslint\.config\.|package\.json$|package-lock\.json$)' && TOOLING=true || true
          has_match '(^|/)(tests?|__tests__)/|\.(spec|test)\.(ts|tsx)$' && TESTS=true || true

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "ui=$UI" >> "$GITHUB_OUTPUT"
          echo "migration=$MIGRATION" >> "$GITHUB_OUTPUT"
          echo "tooling=$TOOLING" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"

      - name: Enforce canonical Supabase migration ownership
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^supabase/migrations/' /tmp/changed-files-non-deleted.txt; then
            echo 'BOUNDARY VIOLATION: active Supabase migrations are owned exclusively by oasisbaklawa2006/oasis-supabase-core.' >&2
            echo 'Move the reviewed migration and database tests to Core; Central may consume the resulting contract only.' >&2
            exit 1
          fi
          echo 'Canonical Supabase migration ownership passed.'

      - name: Setup Node
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.ui == 'true' || steps.changes.outputs.migration == 'true' || steps.changes.outputs.tooling == 'true' || steps.changes.outputs.tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.ui == 'true' || steps.changes.outputs.migration == 'true' || steps.changes.outputs.tooling == 'true' || steps.changes.outputs.tests == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.tooling == 'true'
        run: npm run typecheck

      - name: ESLint changed TypeScript files
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.tooling == 'true' || steps.changes.outputs.tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(grep -E '\.(ts|tsx)$' /tmp/changed-files.txt | while IFS= read -r file; do
            if [ -f "$file" ]; then
              printf '%s\n' "$file"
            fi
          done)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi
          npx eslint "${FILES[@]}"

      - name: Unit and migration contract tests
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.migration == 'true' || steps.changes.outputs.tooling == 'true' || steps.changes.outputs.tests == 'true'
        run: npm run test

      - name: Production build
        if: steps.changes.outputs.app == 'true' || steps.changes.outputs.ui == 'true' || steps.changes.outputs.tooling == 'true'
        env:
          # Publishable/anon values only (never a service-role key) -- these
          # are safe to bake into a client bundle by Supabase's own design
          # (the live production site already ships this exact anon key to
          # every visitor's browser; real access control is RLS, not secrecy
          # of this value). Without these the built app's supabase-js client
          # throws "supabaseUrl is required" at module load in every browser
          # context, which silently broke this CI build's ability to render
          # ANY route -- including the ones visual-audit.spec.ts already
          # screenshots -- before this fix.
          VITE_SUPABASE_URL: https://tcxvcatsqqertcnycuop.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UbNV2X25YHY3cupjpoLsjw_RhlDG4f_
        run: npm run build

      - name: Install Chromium
        if: steps.changes.outputs.ui == 'true'
        run: npx playwright install --with-deps chromium

      - name: Start PR build locally
        if: steps.changes.outputs.ui == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Playwright PR smoke
        if: steps.changes.outputs.ui == 'true'
        env:
          APP_URL: http://127.0.0.1:4173
          TEST_PREVIEW_URL: http://127.0.0.1:4173
        run: npx playwright test tests/visual-audit.spec.ts --project=desktop-chrome-size --trace=on

      # Lane 1 (Central issue #368) authenticated e2e chain coverage, promoted
      # from the manual-dispatch-only lane1-live-smoke.yml into this required
      # gate (Lane 1 B3). Same spec file, same role-separated QA secrets,
      # same JUnit-only/no-HTML-reporter/credential-scrub safeguards as that
      # workflow -- only the trigger surface changes (every PR, not manual).
      - name: Assert Lane 1 credentials are present (fail clear, not silent skip)
        if: steps.changes.outputs.ui == 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in TEST_RGS_EMAIL TEST_RGS_PASSWORD TEST_TV_RGS_EMAIL TEST_TV_RGS_PASSWORD \
                      TEST_PRODUCTION_EMAIL TEST_PRODUCTION_PASSWORD \
                      TEST_TV_PRODUCTION_EMAIL TEST_TV_PRODUCTION_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing required secret(s): ${missing[*]}. See docs/LANE1_QA_ACCOUNT_MATRIX.md for provisioning steps. Refusing to silently skip the authenticated suite."
            exit 1
          fi
          if [[ -z "${TEST_ADMIN_EMAIL:-}" ]]; then
            echo "::notice::TEST_ADMIN_EMAIL/PASSWORD not set -- the six-TV cross-grouping sweep will be skipped (not failed). All role-specific tests still run."
          fi
        env:
          TEST_RGS_EMAIL: ${{ secrets.TEST_RGS_EMAIL }}
          TEST_RGS_PASSWORD: ${{ secrets.TEST_RGS_PASSWORD }}
          TEST_TV_RGS_EMAIL: ${{ secrets.TEST_TV_RGS_EMAIL }}
          TEST_TV_RGS_PASSWORD: ${{ secrets.TEST_TV_RGS_PASSWORD }}
          TEST_PRODUCTION_EMAIL: ${{ secrets.TEST_PRODUCTION_EMAIL }}
          TEST_PRODUCTION_PASSWORD: ${{ secrets.TEST_PRODUCTION_PASSWORD }}
          TEST_TV_PRODUCTION_EMAIL: ${{ secrets.TEST_TV_PRODUCTION_EMAIL }}
          TEST_TV_PRODUCTION_PASSWORD: ${{ secrets.TEST_TV_PRODUCTION_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}

      - name: Run Lane 1 authenticated live smoke (JUnit report only, no HTML reporter)
        if: steps.changes.outputs.ui == 'true'
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: lane1-live-smoke-junit.xml
          TEST_PREVIEW_URL: http://127.0.0.1:4173
          TEST_RGS_EMAIL: ${{ secrets.TEST_RGS_EMAIL }}
          TEST_RGS_PASSWORD: ${{ secrets.TEST_RGS_PASSWORD }}
          TEST_TV_RGS_EMAIL: ${{ secrets.TEST_TV_RGS_EMAIL }}
          TEST_TV_RGS_PASSWORD: ${{ secrets.TEST_TV_RGS_PASSWORD }}
          TEST_PRODUCTION_EMAIL: ${{ secrets.TEST_PRODUCTION_EMAIL }}
          TEST_PRODUCTION_PASSWORD: ${{ secrets.TEST_PRODUCTION_PASSWORD }}
          TEST_TV_PRODUCTION_EMAIL: ${{ secrets.TEST_TV_PRODUCTION_EMAIL }}
          TEST_TV_PRODUCTION_PASSWORD: ${{ secrets.TEST_TV_PRODUCTION_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: npx playwright test tests/lane1-live-smoke.spec.ts --project=desktop-chrome-size --reporter=junit,list

      - name: Assert Lane 1 report contains no live secret value (defense in depth)
        if: ${{ !cancelled() && steps.changes.outputs.ui == 'true' }}
        shell: bash
        env:
          TEST_RGS_PASSWORD: ${{ secrets.TEST_RGS_PASSWORD }}
          TEST_TV_RGS_PASSWORD: ${{ secrets.TEST_TV_RGS_PASSWORD }}
          TEST_PRODUCTION_PASSWORD: ${{ secrets.TEST_PRODUCTION_PASSWORD }}
          TEST_TV_PRODUCTION_PASSWORD: ${{ secrets.TEST_TV_PRODUCTION_PASSWORD }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          report="lane1-live-smoke-junit.xml"
          if [[ ! -f "$report" ]]; then
            echo "$report was not produced -- nothing to check or upload."
            exit 0
          fi
          for name in TEST_RGS_PASSWORD TEST_TV_RGS_PASSWORD TEST_PRODUCTION_PASSWORD TEST_TV_PRODUCTION_PASSWORD TEST_ADMIN_PASSWORD; do
            value="${!name:-}"
            [[ -n "$value" ]] || continue
            if grep -qF -- "$value" "$report"; then
              echo "::error::$report contains the literal value of \$$name -- refusing to upload a credential-bearing report."
              exit 1
            fi
          done
          echo "Confirmed: $report contains none of the QA secret values."

      - name: Upload Lane 1 live smoke report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.changes.outputs.ui == 'true' }}
        with:
          name: lane1-live-smoke-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane1-live-smoke-junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Docs-only fast pass
        if: steps.changes.outputs.app != 'true' && steps.changes.outputs.ui != 'true' && steps.changes.outputs.migration != 'true' && steps.changes.outputs.tooling != 'true' && steps.changes.outputs.tests != 'true'
        run: echo "Documentation-only or metadata-only change; expensive application checks skipped."

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.changes.outputs.ui == 'true' }}
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
