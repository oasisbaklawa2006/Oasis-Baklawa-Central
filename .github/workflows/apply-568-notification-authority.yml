name: Apply 568 notification authority repair

on:
  push:
    branches:
      - fix/561-prelogin-b2b-apply-v2
    paths:
      - .github/workflows/apply-568-notification-authority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/561-prelogin-b2b-apply-v2
          fetch-depth: 0
      - name: Apply bounded integration repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          notify = Path('src/utils/notifyEvent.ts')
          text = notify.read_text()
          old = '''export interface NotifyEventParams {\n  event: string;\n  subject: string;\n  message: string;\n  audiences?: NotifyAudience[];\n  orderId?: string | null;\n  companyId?: string | null;\n  email?: string | null;\n  phone?: string | null;\n}\n'''
          new = '''export interface NotifyEventParams {\n  event: string;\n  subject?: string;\n  message?: string;\n  audiences?: NotifyAudience[];\n  applicationId?: string | null;\n  orderId?: string | null;\n  companyId?: string | null;\n  email?: string | null;\n  phone?: string | null;\n}\n'''
          if old not in text:
              raise SystemExit('NotifyEventParams contract not found')
          text = text.replace(old, new, 1)
          old = '''    return { success: true, data };\n'''
          new = '''    const reportedSuccess =\n      typeof data === "object" && data !== null && "success" in data && typeof data.success === "boolean"\n        ? data.success\n        : true;\n    if (!reportedSuccess) {\n      return { success: false, data, error: "notification_delivery_failed" };\n    }\n    return { success: true, data };\n'''
          if old not in text:
              raise SystemExit('notifyEvent success return not found')
          notify.write_text(text.replace(old, new, 1))

          validator = Path('src/lib/notification-infrastructure/notifyEventValidation.ts')
          text = validator.read_text()
          marker = '''  const event = params.event?.trim();\n  if (!event) return { ok: false, reason: "missing_event" };\n\n  const subject = params.subject?.trim();\n'''
          replacement = '''  const event = params.event?.trim();\n  if (!event) return { ok: false, reason: "missing_event" };\n\n  if (event === "approval_granted") {\n    const applicationId = params.applicationId?.trim();\n    if (!applicationId) return { ok: false, reason: "missing_application_id" };\n    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(applicationId)) {\n      return { ok: false, reason: "invalid_application_id" };\n    }\n    const carriesCallerAuthority = !!(\n      params.subject?.trim() ||\n      params.message?.trim() ||\n      params.email?.trim() ||\n      params.phone?.trim() ||\n      params.orderId?.trim() ||\n      params.companyId?.trim() ||\n      (params.audiences?.length ?? 0) > 0\n    );\n    if (carriesCallerAuthority) {\n      return { ok: false, reason: "approval_payload_must_use_application_authority" };\n    }\n    return { ok: true };\n  }\n\n  const subject = params.subject?.trim();\n'''
          if marker not in text:
              raise SystemExit('validation marker not found')
          validator.write_text(text.replace(marker, replacement, 1))

          admin = Path('src/pages/admin/AdminClients.tsx')
          text = admin.read_text()
          old = '''      notifyEvent({\n        event: "approval_granted",\n        subject: "Welcome to Oasis B2B! Your account is active",\n        message: `Welcome to Oasis B2B! Your account is now active.\\n\\nLogin here: https://b2b.oasisbaklawa.com\\n\\nYour assigned tier: ${priceTier[app.id]}.\\nYou can now place orders, track production live, and access invoices.\\n\\n— Team Oasis Baklawa`,\n        audiences: [],\n        email: app.contact_email,\n        phone: app.mobile_number,\n      }).catch(() => {});\n'''
          new = '''      const approvalNotification = await notifyEvent({\n        event: "approval_granted",\n        applicationId: app.id,\n      });\n      if (!approvalNotification.success) {\n        console.warn("[AdminClients] Approval notification failed after approval commit:", approvalNotification.error);\n        toast.warning("Client approved, but the approval notification requires retry.");\n      }\n'''
          if old not in text:
              raise SystemExit('legacy approval notify block not found')
          admin.write_text(text.replace(old, new, 1))

          test = Path('src/lib/notification-infrastructure/__tests__/b2bApprovalNotificationAuthority.test.ts')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\nimport { validateNotifyEventParams } from "../notifyEventValidation";\n\nconst adminSource = readFileSync("src/pages/admin/AdminClients.tsx", "utf8");\n\ndescribe("B2B approval notification authority", () => {\n  it("accepts only application identity for approval fanout", () => {\n    expect(validateNotifyEventParams({\n      event: "approval_granted",\n      applicationId: "10000000-0000-4000-8000-000000000001",\n    })).toEqual({ ok: true });\n  });\n\n  it("rejects caller-supplied approval message or recipient authority", () => {\n    expect(validateNotifyEventParams({\n      event: "approval_granted",\n      applicationId: "10000000-0000-4000-8000-000000000001",\n      email: "buyer@example.com",\n    })).toEqual({ ok: false, reason: "approval_payload_must_use_application_authority" });\n  });\n\n  it("binds AdminClients to the application-only approval notification contract", () => {\n    expect(adminSource).toContain('event: "approval_granted"');\n    expect(adminSource).toContain("applicationId: app.id");\n    expect(adminSource).not.toContain('subject: "Welcome to Oasis B2B! Your account is active"');\n    expect(adminSource).not.toContain("email: app.contact_email");\n  });\n});\n''')
          PY
          rm .github/workflows/apply-568-notification-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/notifyEvent.ts src/lib/notification-infrastructure/notifyEventValidation.ts src/pages/admin/AdminClients.tsx src/lib/notification-infrastructure/__tests__/b2bApprovalNotificationAuthority.test.ts .github/workflows/apply-568-notification-authority.yml
          git commit -m "fix(b2b): bind approval notification to server authority"
          git push origin HEAD:fix/561-prelogin-b2b-apply-v2
