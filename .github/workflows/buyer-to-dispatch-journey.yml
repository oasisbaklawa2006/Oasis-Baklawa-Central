name: Buyer-to-Dispatch Journey Certification

# Disposable, non-production integration lane. ONE order is created by a synthetic Buyer through Core's governed
# checkout and carried through Finance, Operations, Dispatch, the independent Security Gate and canonical finalization.
# No external provider (MSG91, payments, messaging) is contacted. Never a production-readiness claim.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/buyer-to-dispatch-journey.yml'
      - 'scripts/integration-certification/**'
      - 'scripts/point100-certification/**'
      - 'scripts/factory-certification/**'
      - 'src/lib/point100/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: buyer-to-dispatch-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  buyer-to-dispatch-journey:
    name: Buyer-to-Dispatch uninterrupted journey
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      POINT100_CORE_REPO: ${{ github.workspace }}/oasis-supabase-core
      POINT100_ALLOW_LOCAL_RESET: "true"
      POINT100_CORE_VERIFIED_SHA: 645899439fe0a84806238b9114649eb2c3785a75
      FACTORY_CERT_CORE_REPO: ${{ github.workspace }}/oasis-supabase-core
      FACTORY_CERT_ALLOW_LOCAL_RESET: "true"
      FACTORY_CERT_CREDENTIAL_FILE: /tmp/oasis-factory-certification.env
      JOURNEY_LEDGER_FILE: /tmp/buyer-to-dispatch-journey-ledger.json

    steps:
      - name: Checkout Central
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify protected Core production deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_RELEASE_REPO: oasisbaklawa2006/oasis-supabase-core
          EXPECTED_RELEASE_SHA: ${{ env.POINT100_CORE_VERIFIED_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]

          mapfile -t candidate_runs < <(
            gh api --paginate               "repos/${CORE_RELEASE_REPO}/actions/workflows/production-migration-release.yml/runs?event=workflow_dispatch&status=completed&branch=main&per_page=100"               --jq ".workflow_runs[] | select(.head_sha == \"${EXPECTED_RELEASE_SHA}\" and .conclusion == \"success\") | .id"
          )

          release_run_id=""
          for run_id in "${candidate_runs[@]}"; do
            preflight_conclusion="$(
              gh api "repos/${CORE_RELEASE_REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100"                 --jq '[.jobs[] | select(.name == "Production ledger and dry-run verification")][0].conclusion // ""'
            )"
            deploy_conclusion="$(
              gh api "repos/${CORE_RELEASE_REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100"                 --jq '[.jobs[] | select(.name == "Approved production migration deployment")][0].conclusion // ""'
            )"
            if [[ "${preflight_conclusion}" == "success" && "${deploy_conclusion}" == "success" ]]; then
              release_run_id="${run_id}"
              break
            fi
          done

          if [[ -z "${release_run_id}" ]]; then
            echo "POINT100_PRODUCTION_RELEASE_NOT_CERTIFIED: no successful protected deploy=true Production Migration Release exists for Core ${EXPECTED_RELEASE_SHA}" >&2
            exit 1
          fi

          {
            echo "POINT100_PRODUCTION_MIGRATION_RUN_ID=${release_run_id}"
            echo "POINT100_RECERT_AFTER_CORE_MIGRATION_RUN_ID=${release_run_id}"
          } >> "${GITHUB_ENV}"
          echo "Point100 bound to protected production deployment run ${release_run_id} for Core ${EXPECTED_RELEASE_SHA}."

      - name: Checkout production-certified Core schema authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: oasisbaklawa2006/oasis-supabase-core
          ref: ${{ env.POINT100_CORE_VERIFIED_SHA }}
          path: oasis-supabase-core

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.101.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate journey scripts and exact production pin
        run: |
          bash -n scripts/integration-certification/start-ephemeral.sh
          test "${POINT100_CORE_VERIFIED_SHA}" = "645899439fe0a84806238b9114649eb2c3785a75"

      - name: Unit tests (Point100 and journey source guards)
        run: npm run test -- src/lib/point100

      - name: Run the uninterrupted Buyer-to-Dispatch journey
        run: bash scripts/integration-certification/start-ephemeral.sh

      - name: Upload journey ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buyer-to-dispatch-journey-${{ github.run_id }}
          path: /tmp/buyer-to-dispatch-journey-ledger.json
          if-no-files-found: warn

      - name: Stop disposable backend
        if: always()
        run: |
          if [[ -d "${POINT100_CORE_REPO}" ]]; then
            bash scripts/point100-certification/stop-ephemeral.sh
          else
            echo "Disposable Core was never started; cleanup not required."
          fi
