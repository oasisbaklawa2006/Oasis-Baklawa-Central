name: APPVERSE AI UAT
run-name: APPVERSE AI UAT ${{ inputs.dispatch_head_sha }} deployment-${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Exact Oasis-team Vercel preview URL for the governed Dispatch head"
        required: true
        type: string
      dispatch_head_sha:
        description: "Exact governed Dispatch PR head SHA"
        required: true
        type: string
      deployment_id:
        description: "GitHub deployment id created by Vercel for dispatch_head_sha"
        required: true
        type: string
      enable_ai:
        description: "Enable bounded AI exploratory actions in addition to deterministic assertions"
        required: true
        default: true
        type: boolean
      send_images:
        description: "Send an in-memory screenshot to the AI planner (requires synthetic_target=true)"
        required: true
        default: false
        type: boolean
      synthetic_target:
        description: "Confirm target contains synthetic/certification data suitable for model image input"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  deployments: read

concurrency:
  group: appverse-ai-uat-${{ inputs.dispatch_head_sha }}-${{ inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  validate-target:
    name: Validate exact-head AI-UAT target before secrets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      url: ${{ steps.target.outputs.url }}
    steps:
      - name: Assert trusted default-branch dispatch
        shell: bash
        env:
          AI_UAT_EVENT_NAME: ${{ github.event_name }}
          AI_UAT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$AI_UAT_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::APPVERSE AI UAT is workflow-dispatch only."
            exit 1
          fi
          if [[ "$AI_UAT_REF" != "refs/heads/main" ]]; then
            echo "::error::Refusing AI-UAT dispatch from $AI_UAT_REF. Dispatch the trusted default-branch workflow only."
            exit 1
          fi

      - name: Checkout trusted target validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate exact Vercel deployment evidence
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.target_url }}
          INPUT_HEAD: ${{ inputs.dispatch_head_sha }}
          INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source .github/scripts/appverse-release-controller-lib.sh

          if [[ ! "$INPUT_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::dispatch_head_sha must be an exact 40-character commit SHA."
            exit 1
          fi
          if [[ ! "$INPUT_DEPLOYMENT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::deployment_id must be numeric."
            exit 1
          fi
          if [[ -z "$INPUT_URL" || "$INPUT_URL" == *$'\n'* || "$INPUT_URL" == *$'\r'* ]]; then
            echo "::error::AI-UAT target URL is missing or contains a newline/carriage return."
            exit 1
          fi

          if ! clean_input="$(normalize_vercel_target_url "$INPUT_URL")"; then
            echo "::error::AI-UAT target is not an approved Oasis-team Vercel preview URL."
            exit 1
          fi

          deployment="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$INPUT_DEPLOYMENT_ID")"
          deployment_sha="$(jq -r '.sha // empty' <<<"$deployment")"
          deployment_app="$(jq -r '.performed_via_github_app.slug // empty' <<<"$deployment")"
          deployment_creator="$(jq -r '.creator.login // empty' <<<"$deployment")"

          if [[ "$deployment_sha" != "$INPUT_HEAD" ]]; then
            echo "::error::Deployment $INPUT_DEPLOYMENT_ID is not bound to Dispatch head $INPUT_HEAD."
            exit 1
          fi
          if [[ "$deployment_app" != "vercel" && "$deployment_creator" != "vercel[bot]" ]]; then
            echo "::error::Deployment $INPUT_DEPLOYMENT_ID is not Vercel-authored."
            exit 1
          fi

          statuses="$(gh api --paginate --slurp -X GET "repos/$GITHUB_REPOSITORY/deployments/$INPUT_DEPLOYMENT_ID/statuses?per_page=100")"
          status="$(jq '
            [.[][]
              | select(.state == "success")
              | select((.environment_url // "") != "")
              | select(
                  ((.performed_via_github_app.slug // "") == "vercel")
                  or ((.creator.login // "") == "vercel[bot]")
                )]
            | sort_by(.created_at)
            | last // {}
          ' <<<"$statuses")"
          status_url="$(jq -r '.environment_url // empty' <<<"$status")"
          if [[ -z "$status_url" ]]; then
            echo "::error::No successful Vercel-authored deployment status exists for deployment $INPUT_DEPLOYMENT_ID."
            exit 1
          fi

          if ! clean_status="$(normalize_vercel_target_url "$status_url")"; then
            echo "::error::Vercel-authored deployment status URL is outside the approved Oasis-team preview boundary."
            exit 1
          fi
          if [[ "$clean_input" != "$clean_status" ]]; then
            echo "::error::Requested AI-UAT target does not equal the Vercel-authored environment URL for the exact deployment."
            exit 1
          fi

          echo "url=$clean_status" >> "$GITHUB_OUTPUT"
          echo "Validated exact Dispatch head, Vercel deployment provenance, and target URL before secrets."

  tranche-1:
    needs: validate-target
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_PREVIEW_URL: ${{ needs.validate-target.outputs.url }}
      AI_UAT_ENABLE_AI: ${{ inputs.enable_ai }}
      AI_UAT_SEND_IMAGES: ${{ inputs.send_images }}
      AI_UAT_SYNTHETIC_TARGET: ${{ inputs.synthetic_target }}
      AI_UAT_MODEL: gpt-5.6-luna
      AI_UAT_MAX_STEPS: "7"

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate AI-UAT catalogue unit contract
        run: npx vitest run src/lib/ai-uat/catalogue.test.ts

      - name: Run APPVERSE AI UAT Tranche 1
        id: ai_uat
        continue-on-error: true
        env:
          TEST_DISPATCH_EMAIL: ${{ secrets.TEST_DISPATCH_EMAIL }}
          TEST_DISPATCH_PASSWORD: ${{ secrets.TEST_DISPATCH_PASSWORD }}
          TEST_ASSEMBLY_EMAIL: ${{ secrets.TEST_ASSEMBLY_EMAIL }}
          TEST_ASSEMBLY_PASSWORD: ${{ secrets.TEST_ASSEMBLY_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx playwright test -c playwright.ai-uat.config.ts

      - name: Merge evidence report
        if: always()
        run: node scripts/merge-ai-uat-report.mjs

      - name: Upload sanitized AI-UAT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appverse-ai-uat-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/APPVERSE_AI_UAT_REPORT.md
            test-results/ai-uat-evidence.jsonl
            test-results/ai-uat-playwright-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve deterministic UAT failure signal
        if: always() && steps.ai_uat.outcome == 'failure'
        run: |
          echo "One or more deterministic APPVERSE AI UAT assertions failed. Review the uploaded evidence report."
          exit 1
