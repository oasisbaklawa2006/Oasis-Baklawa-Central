name: APPVERSE AI UAT

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Oasis-team Vercel preview URL (validated before QA secrets are bound)"
        required: true
        type: string
      enable_ai:
        description: "Enable bounded AI exploratory actions in addition to deterministic assertions"
        required: true
        default: true
        type: boolean
      send_images:
        description: "Send an in-memory screenshot to the AI planner (requires synthetic_target=true)"
        required: true
        default: false
        type: boolean
      synthetic_target:
        description: "Confirm target contains synthetic/certification data suitable for model image input"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: appverse-ai-uat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-target:
    name: Validate AI-UAT target before secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      url: ${{ steps.target.outputs.url }}
    steps:
      - name: Validate Oasis Vercel preview target
        id: target
        shell: bash
        env:
          INPUT_URL: ${{ inputs.target_url }}
        run: |
          set -euo pipefail
          url="$INPUT_URL"
          if [[ -z "$url" || "$url" == *$'\n'* || "$url" == *$'\r'* ]]; then
            echo "::error::AI-UAT target URL is missing or contains a newline/carriage return."
            exit 1
          fi

          python3 - "$url" <<'PY' > /tmp/ai-uat-target.txt
          import sys
          from urllib.parse import urlparse, urlunparse

          raw = sys.argv[1]
          parsed = urlparse(raw)
          host = parsed.hostname or ""
          allowed_suffix = ".oasisbaklawa2006-6222s-projects.vercel.app"

          if parsed.scheme != "https":
              raise SystemExit("AI-UAT target must use HTTPS")
          if parsed.username or parsed.password:
              raise SystemExit("AI-UAT target must not contain URL userinfo")
          if parsed.query or parsed.fragment:
              raise SystemExit("AI-UAT target must not contain query or fragment data")
          if not host.endswith(allowed_suffix):
              raise SystemExit(f'AI-UAT host "{host}" is not an approved Oasis-team Vercel preview host')

          clean = urlunparse(("https", parsed.netloc, parsed.path.rstrip("/") or "", "", "", ""))
          print(clean)
          PY

          clean_url="$(cat /tmp/ai-uat-target.txt)"
          echo "url=$clean_url" >> "$GITHUB_OUTPUT"
          echo "Validated non-production AI-UAT target host."

  tranche-1:
    needs: validate-target
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_PREVIEW_URL: ${{ needs.validate-target.outputs.url }}
      AI_UAT_ENABLE_AI: ${{ inputs.enable_ai }}
      AI_UAT_SEND_IMAGES: ${{ inputs.send_images }}
      AI_UAT_SYNTHETIC_TARGET: ${{ inputs.synthetic_target }}
      AI_UAT_MODEL: gpt-5.6-luna
      AI_UAT_MAX_STEPS: "7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate AI-UAT catalogue unit contract
        run: npx vitest run src/lib/ai-uat/catalogue.test.ts

      - name: Run APPVERSE AI UAT Tranche 1
        id: ai_uat
        continue-on-error: true
        env:
          TEST_DISPATCH_EMAIL: ${{ secrets.TEST_DISPATCH_EMAIL }}
          TEST_DISPATCH_PASSWORD: ${{ secrets.TEST_DISPATCH_PASSWORD }}
          TEST_ASSEMBLY_EMAIL: ${{ secrets.TEST_ASSEMBLY_EMAIL }}
          TEST_ASSEMBLY_PASSWORD: ${{ secrets.TEST_ASSEMBLY_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx playwright test -c playwright.ai-uat.config.ts

      - name: Merge evidence report
        if: always()
        run: node scripts/merge-ai-uat-report.mjs

      - name: Upload sanitized AI-UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appverse-ai-uat-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/APPVERSE_AI_UAT_REPORT.md
            test-results/ai-uat-evidence.jsonl
            test-results/ai-uat-playwright-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve deterministic UAT failure signal
        if: always() && steps.ai_uat.outcome == 'failure'
        run: |
          echo "One or more deterministic APPVERSE AI UAT assertions failed. Review the uploaded evidence report."
          exit 1