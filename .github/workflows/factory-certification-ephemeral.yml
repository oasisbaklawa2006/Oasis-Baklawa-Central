name: Factory Operations Ephemeral Certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/factory-certification-ephemeral.yml'
      - 'playwright.factory-cert.config.ts'
      - 'scripts/factory-certification/**'
      - 'src/lib/factoryCertification*.ts'
      - 'src/lib/factoryOperations*.ts'
      - 'src/lib/__tests__/factoryCertification*.test.ts'
      - 'src/lib/__tests__/factoryOperations*.test.ts'
      - 'tests/factory-operations-*.cert.spec.ts'
      - 'tests/factory-certification/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-operations-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  disposable-certification:
    name: Disposable Factory certification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FACTORY_CERT_CORE_REPO: ${{ github.workspace }}/oasis-supabase-core
      FACTORY_CERT_ALLOW_LOCAL_RESET: "true"
      FACTORY_CERT_CREDENTIAL_FILE: /tmp/oasis-factory-certification.env
      FACTORY_CERT_TARGET_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout Central certification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout canonical Core schema authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: oasisbaklawa2006/oasis-supabase-core
          ref: main
          path: oasis-supabase-core

      - name: Checkout Trace client contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: oasisbaklawa2006/oasis-trace
          ref: main
          path: oasis-trace

      - name: Verify merged Core Factory authority dependencies
        shell: bash
        run: |
          production_alias_migration="oasis-supabase-core/supabase/migrations/20260826043000_factory_production_role_alias_parity.sql"
          store_role_migration="oasis-supabase-core/supabase/migrations/20260826093000_3pgs_staff_provisioning_role_parity.sql"
          test -f "${production_alias_migration}"
          test -f "${store_role_migration}"
          grep -q "PROD_ARABIC_SWEETS" "${production_alias_migration}"
          grep -q "PROD_DRAGEES" "${production_alias_migration}"
          grep -qi "store_3rd_party" "${store_role_migration}"
          echo "Core main contains Production role aliases and governed 3PGS staff provisioning parity."

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.101.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Central dependencies
        run: npm ci

      - name: Install Trace dependencies
        run: npm ci --prefix oasis-trace

      - name: Validate certification scripts before execution
        shell: bash
        run: |
          bash -n scripts/factory-certification/start-ephemeral.sh
          bash -n scripts/factory-certification/stop-ephemeral.sh
          node --check scripts/factory-certification/create-test-identities.mjs
          node --check scripts/factory-certification/seed-production-fixtures.mjs

      - name: Start canonical local Core, identities and deterministic fixtures
        shell: bash
        run: bash scripts/factory-certification/start-ephemeral.sh

      - name: Export local backend and disposable identities to this job only
        shell: bash
        run: |
          pushd oasis-supabase-core >/dev/null
          supabase status -o env > "${RUNNER_TEMP}/factory-supabase.env"
          popd >/dev/null
          # shellcheck disable=SC1090
          source "${RUNNER_TEMP}/factory-supabase.env"
          {
            echo "FACTORY_CERT_SUPABASE_URL=${API_URL}"
            echo "FACTORY_CERT_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "FACTORY_CERT_ENVIRONMENT_ID=factory-cert-gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "FACTORY_CERT_GOLDEN_JOB_SHORT_ID=E3ED28B0"
          } >> "${GITHUB_ENV}"

          while IFS= read -r cred_line; do
            if [[ "${cred_line}" =~ ^export\ ([A-Z0-9_]+)_PASSWORD=\'([^\']*)\'$ ]]; then
              echo "::add-mask::${BASH_REMATCH[2]}"
            fi
          done < "${FACTORY_CERT_CREDENTIAL_FILE}"

          sed -n -E "s/^export ([A-Z0-9_]+)='([^']*)'$/\1=\2/p" "${FACTORY_CERT_CREDENTIAL_FILE}" >> "${GITHUB_ENV}"

      - name: Build Central against disposable local Core
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start built Central locally
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "${RUNNER_TEMP}/factory-central-preview.log" 2>&1 &
          preview_pid=$!
          echo "${preview_pid}" > "${RUNNER_TEMP}/factory-central-preview.pid"
          for _ in $(seq 1 60); do
            if ! kill -0 "${preview_pid}" >/dev/null 2>&1; then
              echo "Central certification preview exited before becoming ready." >&2
              cat "${RUNNER_TEMP}/factory-central-preview.log"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:4173/login >/dev/null; then
              echo "Central certification target is ready."
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/factory-central-preview.log"
          exit 1

      - name: Run governed Production truth and read-failure certification
        id: production_cert
        continue-on-error: true
        run: >-
          npx playwright test
          tests/factory-operations-production-truth.cert.spec.ts
          tests/factory-operations-failure-injection.cert.spec.ts
          -c playwright.factory-cert.config.ts

      - name: Preserve Production certification result
        if: always()
        shell: bash
        run: |
          test -f factory-certification-results.json
          cp factory-certification-results.json factory-production-certification-results.json

      - name: Enforce seven executed Production passes and zero skips
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'factory-production-certification-results.json';
          if (!fs.existsSync(path)) {
            throw new Error('CERTIFICATION_RESULT_MISSING: Production Playwright JSON report was not produced');
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const statuses = [];
          const visit = (value) => {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) visit(item);
              return;
            }
            if (Array.isArray(value.results)) {
              for (const result of value.results) {
                if (typeof result?.status === 'string') statuses.push(result.status);
              }
            }
            for (const [key, child] of Object.entries(value)) {
              if (key !== 'results') visit(child);
            }
          };
          visit(report.suites ?? report);
          const counts = statuses.reduce((acc, status) => {
            acc[status] = (acc[status] ?? 0) + 1;
            return acc;
          }, {});
          console.log('Factory Production certification result counts:', counts);
          if (statuses.length !== 7) {
            throw new Error(`CERTIFICATION_COUNT_MISMATCH: expected exactly 7 required Production results, got ${statuses.length}`);
          }
          if ((counts.passed ?? 0) !== 7 || (counts.skipped ?? 0) !== 0 || (counts.failed ?? 0) !== 0 || (counts.timedOut ?? 0) !== 0 || (counts.interrupted ?? 0) !== 0) {
            throw new Error(`CERTIFICATION_NOT_EXECUTED_PASS: ${JSON.stringify(counts)}`);
          }
          NODE
          if [[ "${{ steps.production_cert.outcome }}" != "success" ]]; then
            echo "Production Playwright command itself failed." >&2
            exit 1
          fi

      - name: List full route/role/device health matrix
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test \
            tests/factory-operations-route-health.cert.spec.ts \
            --list \
            -c playwright.factory-cert.config.ts \
            | tee factory-route-health-list.txt

      - name: Run full route/role/device health
        id: route_health
        continue-on-error: true
        run: >-
          npx playwright test
          tests/factory-operations-route-health.cert.spec.ts
          -c playwright.factory-cert.config.ts

      - name: Preserve route-health certification result
        shell: bash
        run: |
          test -f factory-certification-results.json
          cp factory-certification-results.json factory-route-health-results.json

      - name: Enforce complete route-health execution and zero skips
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const resultPath = 'factory-route-health-results.json';
          const listPath = 'factory-route-health-list.txt';
          if (!fs.existsSync(resultPath)) {
            throw new Error('ROUTE_HEALTH_RESULT_MISSING: Playwright JSON report was not produced');
          }
          if (!fs.existsSync(listPath)) {
            throw new Error('ROUTE_HEALTH_LIST_MISSING: Playwright test listing was not preserved');
          }
          const listText = fs.readFileSync(listPath, 'utf8');
          const listed = listText.match(/Total:\s+(\d+)\s+tests?\b/i);
          if (!listed) {
            throw new Error('ROUTE_HEALTH_LIST_UNPARSEABLE: could not determine discovered test count');
          }
          const listedCount = Number(listed[1]);
          if (!Number.isInteger(listedCount) || listedCount < 2) {
            throw new Error(`ROUTE_HEALTH_DISCOVERY_INVALID: discovered ${listedCount} tests`);
          }

          const report = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          const statuses = [];
          const visit = (value) => {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) visit(item);
              return;
            }
            if (Array.isArray(value.results)) {
              for (const result of value.results) {
                if (typeof result?.status === 'string') statuses.push(result.status);
              }
            }
            for (const [key, child] of Object.entries(value)) {
              if (key !== 'results') visit(child);
            }
          };
          visit(report.suites ?? report);
          const counts = statuses.reduce((acc, status) => {
            acc[status] = (acc[status] ?? 0) + 1;
            return acc;
          }, {});
          console.log(`Factory route-health discovered=${listedCount} executed=${statuses.length}`, counts);
          if (statuses.length !== listedCount) {
            throw new Error(`ROUTE_HEALTH_COUNT_MISMATCH: listed ${listedCount}, result file contains ${statuses.length}`);
          }
          if ((counts.passed ?? 0) !== listedCount || (counts.skipped ?? 0) !== 0 || (counts.failed ?? 0) !== 0 || (counts.timedOut ?? 0) !== 0 || (counts.interrupted ?? 0) !== 0) {
            throw new Error(`ROUTE_HEALTH_NOT_EXECUTED_PASS: ${JSON.stringify(counts)}`);
          }
          NODE
          if [[ "${{ steps.route_health.outcome }}" != "success" ]]; then
            echo "Route-health Playwright command itself failed." >&2
            exit 1
          fi

      - name: Run continuous FACT-E2E golden order
        id: golden_order
        continue-on-error: true
        run: >-
          npx playwright test
          tests/factory-operations-golden-order.cert.spec.ts
          -c playwright.factory-cert.config.ts

      - name: Preserve FACT-E2E golden-order certification result
        if: always()
        shell: bash
        run: |
          test -f factory-certification-results.json
          cp factory-certification-results.json factory-golden-order-certification-results.json

      - name: Enforce FACT-E2E golden order executed and PASS
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const resultPath = 'factory-golden-order-certification-results.json';
          const ledgerPath = 'factory-fact-e2e-golden-order.json';
          if (!fs.existsSync(resultPath)) {
            throw new Error('GOLDEN_ORDER_RESULT_MISSING: Playwright JSON report was not produced');
          }
          const report = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          const statuses = [];
          const visit = (value) => {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) visit(item);
              return;
            }
            if (Array.isArray(value.results)) {
              for (const result of value.results) {
                if (typeof result?.status === 'string') statuses.push(result.status);
              }
            }
            for (const [key, child] of Object.entries(value)) {
              if (key !== 'results') visit(child);
            }
          };
          visit(report.suites ?? report);
          const counts = statuses.reduce((acc, status) => {
            acc[status] = (acc[status] ?? 0) + 1;
            return acc;
          }, {});
          console.log('FACT-E2E golden-order certification result counts:', counts);
          if (statuses.length !== 1) {
            throw new Error(`GOLDEN_ORDER_COUNT_MISMATCH: expected exactly 1 continuous golden-order test, got ${statuses.length}`);
          }
          if ((counts.passed ?? 0) !== 1 || (counts.skipped ?? 0) !== 0 || (counts.failed ?? 0) !== 0 || (counts.timedOut ?? 0) !== 0 || (counts.interrupted ?? 0) !== 0) {
            throw new Error(`GOLDEN_ORDER_NOT_EXECUTED_PASS: ${JSON.stringify(counts)}`);
          }

          if (!fs.existsSync(ledgerPath)) {
            throw new Error('GOLDEN_ORDER_LEDGER_MISSING: factory-fact-e2e-golden-order.json was not produced');
          }
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          if (ledger.status !== 'PASS') {
            throw new Error(`GOLDEN_ORDER_LEDGER_NOT_PASS: ${JSON.stringify({ status: ledger.status, failed_stages: ledger.failed_stages, failed_negative_paths: ledger.failed_negative_paths })}`);
          }
          if (ledger.production_accessed !== false || ledger.environment !== 'disposable-local-core') {
            throw new Error('GOLDEN_ORDER_LEDGER_ENVIRONMENT_INVALID: ledger must attest a disposable-local-core run with no production access');
          }
          if (ledger.schema_version !== 1) {
            throw new Error(`GOLDEN_ORDER_LEDGER_SCHEMA_INVALID: expected schema_version=1, got ${ledger.schema_version}`);
          }

          const requiredStages = [
            'pna_create_assembly_job',
            'pna_reserve_assembly_components',
            'production_accept_job',
            'production_start_job',
            'production_advance_stage',
            'production_record_output',
            'production_declare_ready',
            'custody_dispatch_to_rgs',
            'custody_record_receipt',
            'custody_accept_receipt',
            'rgs_reservation_truth_check',
            '3pgs_reserve_requirement_zero_stock',
            'pna_resume_reserve_assembly_components',
            '3pgs_create_procurement_requirement',
            '3pgs_assign_procurement_vendor',
            '3pgs_create_inventory_receipt',
            '3pgs_record_inventory_receipt',
            '3pgs_accept_inventory_receipt',
            '3pgs_allocate_putaway',
            '3pgs_confirm_putaway',
            '3pgs_finalise_grn',
            '3pgs_link_procurement_receipt',
            '3pgs_reserve_requirement_real_stock',
            '3pgs_issue_requirement_stock',
            '3pgs_acknowledge_requirement_receipt',
            'pna_issue_assembly_components',
            'pna_record_consumption_fg',
            'pna_record_consumption_pkg',
            'pna_complete_assembly_job',
            'pna_accept_assembly_output',
            'pna_initiate_assembly_handover',
            'pna_acknowledge_assembly_handover',
            'fg_create_receipt_from_handover',
            'fg_record_receipt_from_handover',
            'fg_accept_receipt_from_handover',
            'fg_allocate_putaway',
            'fg_confirm_putaway',
            'fg_finalise_grn',
            'dispatch_create_consignment',
            'dispatch_open_carton',
            'dispatch_declare_source_handoff',
            'dispatch_record_source_handoff_receipt',
            'dispatch_accept_source_handoff',
            'dispatch_scan_item',
            'dispatch_record_evidence',
            'dispatch_lock_carton',
            'dispatch_create_dpl',
            'dispatch_supersede_dpl',
            'dispatch_submit_to_finance',
          ];
          const requiredNegativePaths = [
            'wrong_department_production_accept_rejected',
            'accept_unrecorded_receipt_rejected',
            'pick_beyond_reserved_qty_rejected',
            'issue_unpicked_reservation_rejected',
            '3pgs_issue_nonexistent_reservation_rejected',
            'unauthorized_consignment_create_rejected',
            'idempotent_scan_retry_no_duplicate',
            'quantity_overflow_scan_rejected',
            'lock_before_evidence_rejected',
            'stale_version_lock_rejected',
            'post_lock_mutation_rejected',
            'blank_reason_supersession_rejected',
            'unauthorized_dpl_submit_rejected',
          ];

          const assertExactStageSet = (actualNames, requiredNames, label) => {
            const actual = actualNames.slice().sort();
            const required = requiredNames.slice().sort();
            const missing = required.filter((name) => !actual.includes(name));
            const extra = actual.filter((name) => !required.includes(name));
            const duplicates = actualNames.filter((name, index) => actualNames.indexOf(name) !== index);
            if (missing.length > 0 || extra.length > 0 || duplicates.length > 0) {
              throw new Error(`GOLDEN_ORDER_LEDGER_${label}_INVALID: ${JSON.stringify({ missing, extra, duplicates })}`);
            }
            if (actual.length !== required.length) {
              throw new Error(`GOLDEN_ORDER_LEDGER_${label}_COUNT_MISMATCH: expected ${required.length}, got ${actual.length}`);
            }
          };

          const stageNames = (ledger.stages ?? []).map((entry) => entry.stage);
          const negativePathNames = (ledger.negative_paths ?? []).map((entry) => entry.stage);
          assertExactStageSet(stageNames, requiredStages, 'STAGES');
          assertExactStageSet(negativePathNames, requiredNegativePaths, 'NEGATIVE_PATHS');

          if (ledger.total_stages !== requiredStages.length || ledger.total_negative_paths !== requiredNegativePaths.length) {
            throw new Error(`GOLDEN_ORDER_LEDGER_TOTALS_INVALID: ${JSON.stringify({
              total_stages: ledger.total_stages,
              expected_stages: requiredStages.length,
              total_negative_paths: ledger.total_negative_paths,
              expected_negative_paths: requiredNegativePaths.length,
            })}`);
          }
          if ((ledger.stages ?? []).length !== requiredStages.length || (ledger.negative_paths ?? []).length !== requiredNegativePaths.length) {
            throw new Error(`GOLDEN_ORDER_LEDGER_ARRAY_LENGTH_INVALID: ${JSON.stringify({
              stages_length: (ledger.stages ?? []).length,
              negative_paths_length: (ledger.negative_paths ?? []).length,
            })}`);
          }

          console.log('FACT-E2E golden-order ledger:', {
            status: ledger.status,
            schema_version: ledger.schema_version,
            total_stages: ledger.total_stages,
            total_negative_paths: ledger.total_negative_paths,
          });
          NODE
          if [[ "${{ steps.golden_order.outcome }}" != "success" ]]; then
            echo "FACT-E2E golden-order Playwright command itself failed." >&2
            exit 1
          fi

      - name: Run Point-37 governed production-release certification
        id: point37_production_release
        continue-on-error: true
        run: >-
          npx playwright test
          tests/factory-operations-order-production-release.cert.spec.ts
          -c playwright.factory-cert.config.ts

      - name: Preserve Point-37 production-release certification result
        if: always()
        shell: bash
        run: |
          test -f factory-certification-results.json
          cp factory-certification-results.json factory-point37-production-release-results.json

      - name: Enforce Point-37 production-release executed and PASS
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const resultPath = 'factory-point37-production-release-results.json';
          const ledgerPath = 'factory-point37-production-release.json';
          if (!fs.existsSync(resultPath)) {
            throw new Error('POINT37_RESULT_MISSING: Playwright JSON report was not produced');
          }
          const report = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          const statuses = [];
          const visit = (value) => {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) visit(item);
              return;
            }
            if (Array.isArray(value.results)) {
              for (const result of value.results) {
                if (typeof result?.status === 'string') statuses.push(result.status);
              }
            }
            for (const [key, child] of Object.entries(value)) {
              if (key !== 'results') visit(child);
            }
          };
          visit(report.suites ?? report);
          const counts = statuses.reduce((acc, status) => {
            acc[status] = (acc[status] ?? 0) + 1;
            return acc;
          }, {});
          console.log('Point-37 production-release certification result counts:', counts);
          if (statuses.length !== 1) {
            throw new Error(`POINT37_COUNT_MISMATCH: expected exactly 1 Point-37 production-release test, got ${statuses.length}`);
          }
          if ((counts.passed ?? 0) !== 1 || (counts.skipped ?? 0) !== 0 || (counts.failed ?? 0) !== 0 || (counts.timedOut ?? 0) !== 0 || (counts.interrupted ?? 0) !== 0) {
            throw new Error(`POINT37_NOT_EXECUTED_PASS: ${JSON.stringify(counts)}`);
          }

          if (!fs.existsSync(ledgerPath)) {
            throw new Error('POINT37_LEDGER_MISSING: factory-point37-production-release.json was not produced');
          }
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const failures = (ledger.checks ?? []).filter((entry) => entry.status === 'FAIL');
          if (failures.length > 0) {
            throw new Error(`POINT37_LEDGER_NOT_PASS: ${JSON.stringify({ failures })}`);
          }
          console.log('Point-37 production-release ledger:', {
            checks: (ledger.checks ?? []).length,
            passed: (ledger.checks ?? []).filter((entry) => entry.status === 'PASS').length,
          });
          NODE
          if [[ "${{ steps.point37_production_release.outcome }}" != "success" ]]; then
            echo "Point-37 production-release Playwright command itself failed." >&2
            exit 1
          fi

      - name: Run Point-38 Golden Pipeline governance-board certification
        id: point38_golden_pipeline
        continue-on-error: true
        run: >-
          npx playwright test
          tests/factory-operations-golden-pipeline.cert.spec.ts
          -c playwright.factory-cert.config.ts

      - name: Preserve Point-38 Golden Pipeline certification result
        if: always()
        shell: bash
        run: |
          test -f factory-certification-results.json
          cp factory-certification-results.json factory-point38-golden-pipeline-results.json

      - name: Enforce Point-38 Golden Pipeline executed and PASS
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const resultPath = 'factory-point38-golden-pipeline-results.json';
          const ledgerPath = 'factory-point38-golden-pipeline.json';
          if (!fs.existsSync(resultPath)) {
            throw new Error('POINT38_RESULT_MISSING: Playwright JSON report was not produced');
          }
          const report = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          const statuses = [];
          const visit = (value) => {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) visit(item);
              return;
            }
            if (Array.isArray(value.results)) {
              for (const result of value.results) {
                if (typeof result?.status === 'string') statuses.push(result.status);
              }
            }
            for (const [key, child] of Object.entries(value)) {
              if (key !== 'results') visit(child);
            }
          };
          visit(report.suites ?? report);
          const counts = statuses.reduce((acc, status) => {
            acc[status] = (acc[status] ?? 0) + 1;
            return acc;
          }, {});
          console.log('Point-38 Golden Pipeline certification result counts:', counts);
          if (statuses.length !== 1) {
            throw new Error(`POINT38_COUNT_MISMATCH: expected exactly 1 Point-38 Golden Pipeline test, got ${statuses.length}`);
          }
          if ((counts.passed ?? 0) !== 1 || (counts.skipped ?? 0) !== 0 || (counts.failed ?? 0) !== 0 || (counts.timedOut ?? 0) !== 0 || (counts.interrupted ?? 0) !== 0) {
            throw new Error(`POINT38_NOT_EXECUTED_PASS: ${JSON.stringify(counts)}`);
          }

          if (!fs.existsSync(ledgerPath)) {
            throw new Error('POINT38_LEDGER_MISSING: factory-point38-golden-pipeline.json was not produced');
          }
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const failures = (ledger.checks ?? []).filter((entry) => entry.status === 'FAIL');
          if (failures.length > 0) {
            throw new Error(`POINT38_LEDGER_NOT_PASS: ${JSON.stringify({ failures })}`);
          }
          const requiredChecks = [
            'fixture_cleared_for_dispatch_order',
            'golden_chain_initial_stage',
            'governance_prepare_evidence',
            'governance_finance_release',
            'governance_readiness_review',
            'governance_completion_attestation',
            'governance_dispatch_finalize',
            'order_status_history_truth',
            'no_direct_orders_update',
            'fail_closed_unauthorized',
          ];
          const actualChecks = (ledger.checks ?? []).map((entry) => entry.check);
          for (const check of requiredChecks) {
            if (!actualChecks.includes(check)) {
              throw new Error(`POINT38_LEDGER_CHECK_MISSING: ${check}`);
            }
          }
          console.log('Point-38 Golden Pipeline ledger:', {
            checks: (ledger.checks ?? []).length,
            passed: (ledger.checks ?? []).filter((entry) => entry.status === 'PASS').length,
          });
          NODE
          if [[ "${{ steps.point38_golden_pipeline.outcome }}" != "success" ]]; then
            echo "Point-38 Golden Pipeline Playwright command itself failed." >&2
            exit 1
          fi

